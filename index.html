<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RJ Sarkar - Brand & Production Designer 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="🏁 🚀 ♾️ ArtViSiON: PRODUCTiōn̄ DESiGN ✨ &quot;Your Vision, Our Creation&quot; ✨ 📢 ADVERTiSiNG | 🏷️ BRANDiNG | 🧠 CREATiVE | 🎨 DESiGNiNG | ✂️ EDiTiNG | 🔥 FUSiON | 🖼️ GRAPHiCS">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      /* ---- 24 karat gold palette (single source of truth) ---- */
      --au-white:  #fffdf2;   /* specular hit          */
      --au-light:  #ffeeb0;   /* lit face              */
      --au-mid:    #f0c84a;   /* true 24k body         */
      --au-rich:   #e0a91c;   /* saturated core        */
      --au-deep:   #b8800c;   /* shadow side           */
      --au-dark:   #8a5f06;   /* darkest crease        */
      --au-glow:   255,184,28;/* rgb for glow shadows  */
      --au-yellow: #ffd400;   /* pure yellow highlight */
      --au-yellow-lt: #ffee55;/* soft yellow           */

      --main-red: #ff0000;
      --accent-red: #ff3333;
      --calculator-dark: #1a0a0a;
      --calculator-btn: #ff1c38;
      --calculator-btn-hover: #fff;
      --calculator-btn-text: #fff;
      --calculator-btn-hover-text: #e0002b;
      --btn-radius: 28px;
      --white: #fff;
      --btn-shadow: 0 2px 22px rgba(255,0,0,0.17);
      --focus-outline: 2px solid #fff;
      --focus-shadow: 0 0 0 2px var(--accent-red);
      --matrix-green: #0f0;
      --darkgrey: transparent;
      --lightgrey: #470000;
      --lightestgrey: #472d2d;
      --red: #870000;
      --yellow: #ff0000;
      --nearlyblack: #a80b00;
      --lightyellow: #fff;
      --grey: #ff0000;
      --card-w: clamp(272px, 88vw, 340px);
      /* one jar unit, tied to the CARD not the viewport */
      --jar-u: calc(var(--card-w) / 87.2);
      --card-ratio: 2 / 3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100vw;
      min-height: 100vh;
      font-family: 'Montserrat', Arial, sans-serif;
      color: var(--white);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      padding: 0;
      margin: 0;
      position: relative;
      z-index: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0e0909 0%, #211919 33%, #2b0e13 66%, #ff0000 100%);
      background-size: 200% 200%;
      animation: bggradientmove 6s ease-in-out infinite alternate;
    }
    @keyframes bggradientmove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .holo-grid {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,0,0,0.14) 0 2px, transparent 2px 50px),
        repeating-linear-gradient(90deg, rgba(255,0,0,0.12) 0 2px, transparent 2px 50px);
      z-index: 2;
      animation: gridPulse 5s ease-in-out infinite alternate;
      opacity: 0.19;
      background-size: 50px 50px;
      will-change: opacity;
      mix-blend-mode: lighten;
    }
    @keyframes gridPulse {
      0%, 100% { opacity: 0.14; }
      50% { opacity: 0.32; }
    }
    #matrix-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.2;
      background: transparent;
      mix-blend-mode: lighten;
    }
    .container {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      z-index: 10;
      padding-bottom: 30px;
      border: 0px solid var(--main-red);
      box-sizing: border-box;
    }
    .card-container {
      width: var(--card-w);
      aspect-ratio: var(--card-ratio);
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 0 auto;
      z-index: 10;
    }
    .business-card {
      position: relative;
      width: var(--card-w);
      aspect-ratio: var(--card-ratio);
      height: auto;
      border-radius: 15px;
      background:
        linear-gradient(135deg, rgba(30,12,12,0.82) 0%, rgba(14,14,14,0.86) 50%, rgba(30,12,12,0.82) 100%);
      background-clip: padding-box;
      backdrop-filter: blur(16px) saturate(135%) brightness(0.62);
      -webkit-backdrop-filter: blur(16px) saturate(135%) brightness(0.62);
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      box-sizing: border-box;
      overflow: visible;
      box-shadow: 0 8px 36px 0 rgba(255,0,0,0.35), 0 0 0 1px rgba(255,0,0,0.15);
      z-index: 10;
    }
    .calculator-screen {
      width: 92%;
      min-height: 205px;
      max-height: 248px;
      flex: 0 0 auto;
      margin: 0 auto;
      margin-top: 16px;
      margin-bottom: 0;
      justify-content: center;
      background:
        linear-gradient(135deg, rgba(150,14,14,0.62) 0%, rgba(30,6,6,0.74) 52%, rgba(150,14,14,0.62) 100%);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 
        0 4px 28px 0 rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.22),
        inset 0 -12px 20px -12px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,0,0,0.08);
      position: relative;
      padding: 1.1rem 1.1rem 0.7rem 1.1rem;
      overflow: hidden;
      backdrop-filter: blur(20px) saturate(155%) brightness(0.68);
      -webkit-backdrop-filter: blur(20px) saturate(155%) brightness(0.68);
      border: 1.5px solid rgba(255,80,80,0.26);
    }
    .glass-panel { position: relative; overflow: hidden; }
    /* ---- water-glass texture: soft refraction ripples + frost grain ---- */
    .glass-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background:
        radial-gradient(120% 60% at 18% 8%,  rgba(255,255,255,0.16), transparent 58%),
        radial-gradient(90%  50% at 82% 92%, rgba(255,255,255,0.09), transparent 62%),
        radial-gradient(38% 26% at 66% 22%, rgba(255,255,255,0.11), transparent 70%),
        radial-gradient(30% 20% at 24% 74%, rgba(255,255,255,0.08), transparent 72%),
        repeating-linear-gradient(104deg,
          rgba(255,255,255,0.030) 0px,
          rgba(255,255,255,0.030) 2px,
          rgba(255,255,255,0.0)   2px,
          rgba(255,255,255,0.0)   16px),
        repeating-linear-gradient(104deg,
          rgba(0,0,0,0.035) 0px,
          rgba(0,0,0,0.035) 3px,
          rgba(0,0,0,0.0)   3px,
          rgba(0,0,0,0.0)   22px);
      box-shadow:
        inset 0  1px 0 rgba(255,255,255,0.34),
        inset 0 -1px 0 rgba(255,255,255,0.10),
        inset  1px 0 0 rgba(255,255,255,0.13),
        inset -1px 0 0 rgba(255,255,255,0.13),
        inset 0 0 26px rgba(0,0,0,0.42);
      border-radius: inherit;
    }
    .glass-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        rgba(255,255,255,0.022) 0px,
        rgba(255,255,255,0.022) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 4;
    }
    .screen-glare {
      position: absolute;
      top: -25%;
      left: -85%;
      width: 55%;
      height: 150%;
      background: linear-gradient(115deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.05) 45%, transparent 72%);
      transform: rotate(-11deg);
      pointer-events: none;
      z-index: 3;
    }
    .glass-shine {
      position: absolute;
      top: 0;
      left: -30%;
      width: 52%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.04) 30%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0.04) 70%, transparent 100%);
      transform: skewX(-18deg);
      -webkit-transform: skewX(-18deg);
      animation: shineSweep 5s ease-in-out infinite;
      opacity: 0.9;
      filter: blur(2px);
      -webkit-filter: blur(2px);
      mix-blend-mode: overlay;
      transition: opacity 0.2s;
    }
    @keyframes shineSweep {
      0% { left: -60%; }
      28% { left: 130%; }
      100% { left: 130%; }
    }
    .neon-text {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(2rem, 7.2vw, 2.6rem);
      color: #fff;
      letter-spacing: 1.5px;
      margin-top: 0;
      margin-bottom: 0.2rem;
      word-break: break-word;
      line-height: 1.15;
      text-shadow:
        0 0 7px var(--main-red),
        0 0 14px var(--accent-red),
        0 0 8px var(--main-red);
      transition: color 0.2s;
      z-index: 3;
      position: relative;
    }
    .subtitle {
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: clamp(0.85rem, 1.5vw, 1.15rem);
      color: var(--accent-red);
      opacity: 0.92;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.28rem;
      font-weight: 400;
      z-index: 3;
      position: relative;
    }
    .year-animate {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.13rem;
      margin-bottom: 0;
      min-height: 1.9rem;
      z-index: 3;
      position: relative;
    }
    .year-digit {
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      color: #fff;
      animation: funny-bounce 4s infinite alternate cubic-bezier(.44,1.36,.89,.62);
      text-shadow: none;
      margin: 0 1px;
      letter-spacing: 1px;
    }
    .year-digit:nth-child(2) { animation-delay: 0.15s;}
    .year-digit:nth-child(3) { animation-delay: 0.3s;}
    .year-digit:nth-child(4) { animation-delay: 0.45s;}
    @keyframes funny-bounce {
      0% { transform: translateY(0) rotate(-5deg) scale(1);}
      30% { transform: translateY(-5px) rotate(5deg) scale(1.08);}
      60% { transform: translateY(0) rotate(-3deg) scale(1);}
      100% { transform: translateY(-7px) rotate(8deg) scale(1.1);}
    }
    .screen-headline-bar {
      width: 100%;
      background: transparent;
      color: #fff;
      z-index: 10;
      overflow: hidden;
      min-height: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 400;
      font-size: 0.97rem;
      padding: 0;
      /* balanced gap under the year row */
      margin-top: 18px;
      margin-bottom: 0;
      flex: 0 0 auto;
      position: relative;
      border-radius: 15px;
      letter-spacing: 0.02em;
      justify-content: center;
    }
    .screen-scroll-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen-scroll-text {
      display: flex;
      align-items: center;
      font-size: clamp(0.82rem, 2.8vw, 0.95rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 24px;
      height: 24px;
      color: #fff;
      text-shadow: 0 0 6px #000, 0 0 1px var(--accent-red);
      font-family: 'Montserrat', Arial, sans-serif;
      position: relative;
      z-index: 3;
    }
    .scrolling-text-inner {
      backface-visibility: hidden;
      transform: translate3d(0,0,0);
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: clamp(9px, 2.8vw, 15px) clamp(10px, 3.2vw, 18px);
      width: 92%;
      /* bottom-aligned, exactly like the back face's social grid */
      margin: auto auto 0 auto;
      flex: 0 0 auto;
      z-index: 2;
      padding: 0 7px;
    }
    .contact-btn, .offer-btn {
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
      width: 100%;
      padding: clamp(0.72rem, 2.6vw, 0.98rem) 0.14rem;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.28);
      background: linear-gradient(160deg, rgba(255,110,110,0.95) 0%, rgba(255,0,0,0.92) 45%, rgba(150,0,0,0.95) 100%);
      color: var(--calculator-btn-text);
      font-weight: 400;
      font-size: 0.93rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.31rem;
      cursor: pointer;
      transition: background 0.17s, color 0.17s, box-shadow 0.18s, transform 0.15s;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      min-height: clamp(44px, 11.5vw, 48px);
      max-height: 60px;
      outline: none;
      text-align: center;
      box-sizing: border-box;
      box-shadow:
        var(--btn-shadow),
        0 5px 10px rgba(0,0,0,0.35),
        inset 0 2px 2px rgba(255,255,255,0.65),
        inset 0 -4px 6px rgba(80,0,0,0.55),
        inset 0 0 0 1px rgba(255,255,255,0.18);
      margin: 0;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Montserrat', Arial, sans-serif;
    }
    .contact-btn::after, .offer-btn::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 5%;
      width: 90%;
      height: 46%;
      border-radius: 50px 50px 60% 60% / 40px 40px 100% 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.22) 55%, rgba(255,255,255,0) 100%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
      filter: blur(0.2px);
    }
    .contact-btn:active, .offer-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow:
        0 2px 5px rgba(0,0,0,0.35),
        inset 0 3px 6px rgba(0,0,0,0.4),
        inset 0 -1px 1px rgba(255,255,255,0.3);
    }
    .contact-btn:focus, .offer-btn:focus {
      outline: var(--focus-outline);
      box-shadow: var(--focus-shadow);
    }
    .contact-btn::before, .offer-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.11) 50%, transparent 100%);
      transition: left 0.5s;
      z-index: 1;
      pointer-events: none;
    }
    .contact-btn:hover::before, .offer-btn:hover::before { left: 100%; }
    .contact-btn:hover, .contact-btn:focus-visible,
    .offer-btn:hover, .offer-btn:focus-visible {
      background: linear-gradient(160deg, #ffffff 0%, #ffe9e9 45%, #ffd0d0 100%);
      color: var(--calculator-btn-hover-text);
      box-shadow:
        0 3px 14px 0px var(--accent-red), var(--btn-shadow),
        inset 0 2px 3px rgba(255,255,255,0.9),
        inset 0 -3px 5px rgba(200,0,0,0.25),
        inset 0 0 0 1px rgba(255,255,255,0.6);
      z-index: 2;
    }
    .contact-btn:hover i, .contact-btn:focus-visible i,
    .contact-btn:hover span, .contact-btn:focus-visible span,
    .offer-btn:hover i, .offer-btn:focus-visible i,
    .offer-btn:hover span, .offer-btn:focus-visible span {
      color: #e0002b !important;
    }
    .contact-btn i, .offer-btn i {
      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      color: #fff;
      min-width: 1.1rem;
      z-index: 2;
      position: relative;
      text-shadow: 0 1px 1px rgba(0,0,0,0.35);
    }
    .contact-btn span, .offer-btn span {
      font-size: clamp(0.7rem, 2.4vw, 0.8rem);
      line-height: .5;
      z-index: 2;
      color: inherit;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0.01em;
      margin-left: 1px;
      position: relative;
      text-shadow: 0 1px 1px rgba(0,0,0,0.25);
    }
    .offer-btn {
      min-width: 0;
      width: 100%;
      margin: 0;
      padding: 0.98rem 0.14rem 0.98rem 0.14rem;
    }
    .floating-elements {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 3;
    }
    .floating-icon {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.13;
      color: var(--main-red);
      animation: floatIcon 5s infinite ease-in-out;
      pointer-events: none;
    }
    .floating-icon.fa-code { top: 12%; left: 10%; animation-delay: 0s;}
    .floating-icon.fa-palette { top: 30%; right: 7%; animation-delay: 10s;}
    .floating-icon.fa-rocket { top: 65%; left: 8%; animation-delay: 20s;}
    .floating-icon.fa-star { top: 82%; right: 23%; animation-delay: 30s;}
    .floating-icon.fa-heart { top: 47%; right: 5%; animation-delay: 40s;}
    .floating-icon.fa-lightbulb { top: 15%; right: 30%; animation-delay: 3.2s;}
    .floating-icon.fa-magic { top: 75%; left: 25%; animation-delay: 5.3s;}
    .floating-icon.fa-music { top: 50%; left: 40%; animation-delay: 2.6s;}
    .floating-icon.fa-gamepad { top: 80%; left: 70%; animation-delay: 3.2s;}
    .floating-icon.fa-glasses { top: 20%; right: 45%; animation-delay: 4.1s;}
    .floating-icon.fa-calculator { top: 35%; left: 60%; animation-delay: 1.3s;}
    .floating-icon.fa-equals { top: 60%; right: 18%; animation-delay: 2.9s;}
    .floating-icon.fa-divide { top: 25%; left: 20%; animation-delay: 3.8s;}
    .floating-icon.fa-square-root-alt { top: 70%; right: 5%; animation-delay: 1.7s;}
    .floating-icon.fa-plus { top: 25%; right: 15%; animation-delay: 2.5s;}
    .floating-icon.fa-minus { top: 80%; left: 15%; animation-delay: 2.2s;}
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.13; }
      50% { transform: translateY(-18px) rotate(180deg); opacity: 0.05; }
    }

    /* ---------- Services floating background ---------- */
    .services-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 3;
    }
    .service-chip {
      position: absolute;
      bottom: -60px;
      white-space: nowrap;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 500;
      font-size: clamp(0.6rem, 2vw, 0.7rem);
      letter-spacing: 0.03em;
      color: #ffc9c9;
      background: rgba(255, 0, 0, 0.07);
      border: 1px solid rgba(255, 51, 51, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      text-shadow: 0 0 5px rgba(255, 0, 0, 0.4);
      opacity: 0;
      animation-name: chipFloat;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      will-change: transform, opacity;
      transform: translate3d(0,0,0);
      backface-visibility: hidden;
      contain: layout paint;
    }
    .service-chip.long {
      white-space: normal;
      max-width: 190px;
      text-align: center;
      font-size: clamp(0.56rem, 1.9vw, 0.63rem);
      line-height: 1.35;
      padding: 8px 12px;
    }
    @keyframes chipFloat {
      0%   { transform: translate3d(0, 0, 0); opacity: 0; }
      8%   { opacity: 0.8; }
      88%  { opacity: 0.8; }
      100% { transform: translate3d(var(--drift, 0px), -130vh, 0); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .service-chip { animation: none; opacity: 0; }
    }
    /* ---------------------------------------------------- */

    .share-fab {
      -webkit-appearance: none;
      appearance: none;
      position: fixed;
      bottom: 32px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: linear-gradient(45deg, var(--main-red), var(--accent-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(255,0,0,0.23);
      transition: all 0.15s ease;
      border: none;
      font-size: 0.85rem;
      outline: none;
    }
    .share-fab:focus { outline: var(--focus-outline); box-shadow: var(--focus-shadow); }
    .share-fab:hover, .share-fab:focus-visible {
      transform: scale(1.07) rotate(360deg);
      box-shadow: 0 4px 12px rgba(255,0,0,0.28);
    }
    .quantum-cursor {
      pointer-events: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,0,0,0.09) 0%, rgba(255,0,0,0.03) 40%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: all 0.1s ease;

    /* ---- Safari/WebKit flex blow-out guard ----
       A flex item's default min-width is "auto", i.e. its max-content size.
       The marquee (.scrolling-text-inner) is ~8300px of nowrap text, and WebKit
       propagates that max-content width all the way up the flex chain, so the
       whole front face computed to ~8400px instead of 340px and the card
       rendered broken/garbled in Safari. Chrome happened to clamp it; per spec
       min-width:0 is required. Fixes "Safari me thik se nahi dikh raha". */
    .card-face,
    .calculator-screen,
    .screen-headline-bar,
    .screen-scroll-container,
    .screen-scroll-text,

      min-width: 0;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 15px;
      overflow: hidden;
      /* Safari/WebKit needs each face on its OWN z-plane. Without this both
         faces sit coplanar at z=0, WebKit z-fights and paints the mirrored
         back face over the front -> card looks reversed/garbled. */
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }
    .card-face.front {
      -webkit-transform: translateZ(1px);
      transform: translateZ(1px);
      z-index: 2;
      /* same bottom breathing room as .card-face.back so both sides match */
      padding-bottom: 14px;
      justify-content: flex-start;

    /* ---- Safari/WebKit backface-visibility fix ----
       WebKit does not reliably honour backface-visibility:hidden for these
       faces, so it painted the MIRRORED back face on top of the front and the
       card looked reversed/unreadable in Safari. Explicitly hiding the
       away-facing side is the robust cross-engine fix. The 0.4s delay is
       half of the 0.8s flip so the swap happens edge-on and stays invisible. */
    .card-face { transition: visibility 0s linear 0.4s; }
    .card-flip:not(.flipped) .card-face.back { visibility: hidden; }
    .card-flip.flipped .card-face.front { visibility: hidden; }
    .card-face.back {
      transform: rotateY(180deg) translateZ(1px);
      -webkit-transform: rotateY(180deg) translateZ(1px);
      background: linear-gradient(135deg, #000000, #1a1a1a);
      display: flex;

       whatever space is left between the display panel and the button grid. */

    .firefly-mini-container {

    }

      position: absolute;
      left: 0;
      /* lift by the 2u of empty space above the jar lid */
      top: calc(-2 * var(--jar-u) * var(--jar-s));
      width: calc(80 * var(--jar-u));
      height: calc(80 * var(--jar-u));
      transform: scale(var(--jar-s));
      -webkit-transform: scale(var(--jar-s));

    .jar {
      position: absolute;
      width: calc(60 * var(--jar-u));

      border-bottom-left-radius: calc(10 * var(--jar-u));
      border-bottom-right-radius: calc(10 * var(--jar-u));
      top: calc(30 * var(--jar-u));
      left: calc(10 * var(--jar-u));

    .jartop {

      width: calc(48 * var(--jar-u));

    .firefly { position: absolute; width: calc(0 * var(--jar-u)); height: calc(0 * var(--jar-u)); left: calc(10 * var(--jar-u)); top: calc(+10 * var(--jar-u)); z-index: 1; }
    .body { position: absolute; width: calc(12 * var(--jar-u)); height: calc(10 * var(--jar-u)); background: var(--red); left: calc(14 * var(--jar-u)); top: calc(15 * var(--jar-u)); z-index: 1; }
    .bodybottom { position: absolute; width: calc(12 * var(--jar-u)); height: calc(12 * var(--jar-u)); background: var(--yellow); top: calc(9 * var(--jar-u)); border-radius: 0 0 calc(10 * var(--jar-u)) calc(10 * var(--jar-u)); z-index: -1; }
    .wing { position: absolute; background: var(--nearlyblack); border-radius: 50%; width: calc(25 * var(--jar-u)); height: calc(9.5 * var(--jar-u)); top: calc(7 * var(--jar-u)); transform-origin: 100% 50%; z-index: 3; }
    .wing-left { left: calc(-5 * var(--jar-u)); transform: rotate(-45deg); }

    .head { position: absolute; width: calc(8 * var(--jar-u)); height: calc(8 * var(--jar-u)); border-radius: 50%; background: var(--nearlyblack); left: calc(16 * var(--jar-u)); top: calc(4 * var(--jar-u)); z-index: 2; }
    .head::before, .head::after {

    @keyframes flap-left { 0% { transform: rotate(-75deg); } 50% { transform: rotate(-15deg); } }
    @keyframes flap-right { 0% { transform: rotate(75deg); } 50% { transform: rotate(15deg); } }
    @keyframes shake {
      0%, 100% { transform: translate(1px, 1px) rotate(0deg); }

      30% { transform: translate(3px, 2px) rotate(0deg); }

    /* ---------- Free-roaming firefly (same firefly, just released from the jar) ---------- */

    html.intro-lock, html.intro-lock body { overflow: hidden; height: 100%; }

      background:
        linear-gradient(180deg, rgba(255,255,255,0.028) 0%, transparent 14%),
        radial-gradient(120% 80% at 50% 0%, rgba(120,0,0,0.16) 0%, transparent 62%),
        linear-gradient(135deg, #080505 0%, #150d0d 46%, #0a0606 100%);
      box-shadow: inset 0 0 90px rgba(0,0,0,0.85);
      transition: transform 1s cubic-bezier(.77,0,.18,1);
      z-index: 3;
      overflow: hidden;
    }
    .gate-left  { left: 0;  transform: translateX(0); }
    .gate-right { right: 0; transform: translateX(0); }

    /* thin molten-gold seam at the centre join */
    .gate-panel::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(255,212,0,0.38) 14%,
        rgba(255,250,190,0.98) 46%,
        rgba(255,222,40,0.55) 62%,
        rgba(255,212,0,0.34) 86%,
        transparent 100%);
      box-shadow: 0 0 10px rgba(255,214,30,0.62), 0 0 22px rgba(230,180,10,0.34);
      animation: gateSeamGlow 2.8s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes gateSeamGlow {
      0%, 100% { opacity: 0.68; }
      50%      { opacity: 1; }
    }
    .gate-left::after  { right: 0; }
    .gate-right::after { left: 0; }

    /* ---- the golden frame: a hairline gold border, nothing filled ---- */
    .gate-ornament {
      position: absolute;
      top: 16px; bottom: 16px; left: 16px; right: 16px;
      border: 1.4px solid transparent;
      border-radius: 2px;
      pointer-events: none;
      z-index: 1;
      /* gradient border via two backgrounds clipped to padding/border box */
      background:
        linear-gradient(#0000, #0000) padding-box,
        repeating-linear-gradient(180deg,
          #c99522 0px,
          #ffe93a 20px,
          #fffbe6 40px,
          #ffd400 62px,
          #ffffff 80px,
          #f5e02a 100px,
          #f0c84a 118px,
          #a8760c 140px,
          #ffee55 164px,
          #fffdf2 184px,
          #ffd400 204px,
          #ffffff 222px,
          #e0a91c 238px,
          #c99522 250px) border-box;
      -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      filter: drop-shadow(0 0 6px rgba(255,220,60,0.85)) drop-shadow(0 0 14px rgba(255,196,20,0.42));
    }
    .gate-left .gate-ornament  { border-right-color: transparent; }

    /* glitter: fine sparkle grains that drift along the frame only */
    .gate-ornament::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 4px;
      background-image:
        radial-gradient(circle, rgba(255,246,150,1) 0 1.5px, transparent 2.4px),
        radial-gradient(circle, rgba(255,212,0,0.95) 0 1.2px, transparent 2px),
        radial-gradient(circle, rgba(255,255,225,1) 0 1px, transparent 1.7px);
      background-size: 13px 13px, 19px 19px, 29px 29px;
      background-position: 0 0, 6px 9px, 15px 4px;
      /* keep the sparkles strictly on the frame line */
      -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      border: 7px solid #000;
      animation: gateGlitter 3.4s linear infinite, gateGlitterFade 2.2s ease-in-out infinite;
      filter: drop-shadow(0 0 4px rgba(255,232,80,1)) drop-shadow(0 0 9px rgba(255,205,0,0.75));
    }
    @keyframes gateGlitter {
      0%   { background-position: 0 0, 6px 9px, 15px 4px; }
      100% { background-position: 0 -13px, 6px -10px, 15px -25px; }
    }
    @keyframes gateGlitterFade {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }

    /* single specular glint that sweeps the frame, corner to corner */
    .gate-ornament::after {
      content: '';
      position: absolute;
      inset: -2.5px;
      border-radius: 4px;
      background: linear-gradient(115deg,
        transparent 38%,
        rgba(255,240,150,0.0) 44%,
        rgba(255,248,180,0.98) 50%,
        rgba(255,240,150,0.0) 56%,
        transparent 62%);
      background-size: 260% 260%;
      -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      border: 6px solid #000;
      animation: gateGlint 3.8s ease-in-out infinite;
    }
    .gate-right .gate-ornament::after { animation-delay: 0.6s; }
    @keyframes gateGlint {
      0%       { background-position: 120% 120%; opacity: 0; }
      12%      { opacity: 1; }
      68%      { opacity: 1; }
      100%     { background-position: -30% -30%; opacity: 0; }
    }

    /* corner gold pips - minimal accents */
    .gate-corner {
      position: absolute;
      width: 13px; height: 13px;
      border: 0 solid var(--au-yellow-lt);
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 0 4px var(--au-yellow)) drop-shadow(0 0 10px rgba(255,212,0,0.95)) drop-shadow(0 0 20px rgba(205,155,10,0.5));
      animation: gateCornerPulse 2.8s ease-in-out infinite;
    }
    .gate-corner.tl { top: 13px;    left: 13px;  border-top-width: 2px; border-left-width: 2px; }
    .gate-corner.tr { top: 13px;    right: 13px; border-top-width: 2px; border-right-width: 2px; }
    .gate-corner.bl { bottom: 13px; left: 13px;  border-bottom-width: 2px; border-left-width: 2px; }
    .gate-corner.br { bottom: 13px; right: 13px; border-bottom-width: 2px; border-right-width: 2px; }
    @keyframes gateCornerPulse {
      0%, 100% { opacity: 0.65; }
      50%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gate-panel::after, .gate-ornament::before,
      .gate-ornament::after, .gate-corner { animation: none !important; }
    }

    #introRoot.stage-open .gate-left  { transform: translateX(-101%); }
    #introRoot.stage-open .gate-right { transform: translateX(101%); }

    /* ---- BENGALI ALPONA MOTIF (minimal, on the gate leaves) ---- */
    .alpona {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(88%, 250px);
      aspect-ratio: 1;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      color: #ff2222;
      transition: opacity 0.9s ease;
    }
    .alpona svg { fill: none; }
    .alpona svg .draw { stroke: currentColor; vector-effect: non-scaling-stroke; }
    .alpona svg .pip { fill: currentColor; stroke: none; }
    .alpona svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .alpona svg [stroke] {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    #introRoot.stage-alpona .alpona { opacity: 0.9; }

    /* the alpona draws itself on, stroke by stroke */
    .alpona .draw {
      stroke-dasharray: var(--len, 900);
      stroke-dashoffset: var(--len, 900);
      filter: drop-shadow(0 0 4px rgba(255,30,30,0.85));
    }
    #introRoot.stage-alpona .alpona .draw {
      animation: alponaDraw 1.5s cubic-bezier(.55,.1,.35,1) forwards;
    }
    #introRoot.stage-alpona .alpona .d2 { animation-delay: 0.18s; }
    #introRoot.stage-alpona .alpona .d3 { animation-delay: 0.34s; }
    #introRoot.stage-alpona .alpona .d4 { animation-delay: 0.5s; }
    @keyframes alponaDraw { to { stroke-dashoffset: 0; } }

    /* dotted rice-flour pips that pop in after the lines */
    .alpona .pip {
      fill: currentColor;
      stroke: none;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      filter: drop-shadow(0 0 3px rgba(255,40,40,0.9));
    }
    #introRoot.stage-alpona .alpona .pip {
      animation: alponaPip 0.5s ease-out forwards, alponaTwinkle 2.4s ease-in-out 1.4s infinite;
    }
    #introRoot.stage-alpona .alpona .pip:nth-of-type(even) { animation-delay: 1.05s, 1.7s; }
    #introRoot.stage-alpona .alpona .pip:nth-of-type(odd)  { animation-delay: 0.92s, 1.55s; }
    @keyframes alponaPip {
      0%   { opacity: 0; transform: scale(0.2); }
      70%  { opacity: 1; transform: scale(1.35); }
      100% { opacity: 0.92; transform: scale(1); }
    }
    @keyframes alponaTwinkle {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
    /* slow ceremonial rotation on the outer ring only */
    .alpona .spin { transform-origin: 100px 100px; animation: alponaSpin 34s linear infinite; }

    @keyframes alponaSpin { to { transform: rotate(360deg); } }

    /* ---- GATE WORDS: red-only, WELCOME (left) then CONNECTION (right) ---- */
    .gate-word {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      text-align: center;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .gate-left  .gate-word { font-size: clamp(0.62rem, 3.05vw, 1.02rem); letter-spacing: 0.12em; }
    .gate-right .gate-word { font-size: clamp(0.62rem, 3.05vw, 1.02rem); letter-spacing: 0.12em; }
    #introRoot.stage-word-l .gate-left  .gate-word,
    #introRoot.stage-word-r .gate-right .gate-word { opacity: 1; }

    .gate-word .ltr {
      display: inline-block;
      color: #4a0d0d;                       /* unlit filament */
      opacity: 0;
      transform: translateY(6px);
      text-shadow: none;
    }
    /* strike each letter on, RED only */
    #introRoot.stage-word-l .gate-left  .gate-word .ltr,
    #introRoot.stage-word-r .gate-right .gate-word .ltr {
      animation: redStrike 0.45s ease-out forwards;
    }
    .gate-word .ltr:nth-child(1)  { animation-delay: 0.00s, 0.62s; }
    .gate-word .ltr:nth-child(2)  { animation-delay: 0.07s, 0.69s; }
    .gate-word .ltr:nth-child(3)  { animation-delay: 0.14s, 0.76s; }
    .gate-word .ltr:nth-child(4)  { animation-delay: 0.21s, 0.83s; }
    .gate-word .ltr:nth-child(5)  { animation-delay: 0.28s, 0.90s; }
    .gate-word .ltr:nth-child(6)  { animation-delay: 0.35s, 0.97s; }
    .gate-word .ltr:nth-child(7)  { animation-delay: 0.42s, 1.04s; }
    .gate-word .ltr:nth-child(8)  { animation-delay: 0.49s, 1.11s; }
    .gate-word .ltr:nth-child(9)  { animation-delay: 0.56s, 1.18s; }
    .gate-word .ltr:nth-child(10) { animation-delay: 0.63s, 1.25s; }
    /* clean fade-up reveal - flat red, NO glow at all */
    @keyframes redStrike {
      0%   { opacity: 0; transform: translateY(6px); color: #4a0d0d; }
      100% { opacity: 1; transform: translateY(0);   color: #e63030; }
    }
    @keyframes redHum {
      0%, 100% { filter: none; }
    }
    /* glow pool removed - the words are flat red now */
    .gate-word-glow { display: none; }
    #introRoot.stage-word-l .gate-left  .gate-word-glow,
    #introRoot.stage-word-r .gate-right .gate-word-glow { opacity: 1; }

    /* everything on the leaves dims out just before the doors part */
    /* ---- GATE ICONS: neon red line-art with a minimal gold accent ---- */
    .gate-icon {
      position: absolute;
      left: 50%;
      top: calc(50% - 40px);
      transform: translate(-50%, -50%) scale(1);
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      color: #ff3b3b;
    }
    .gate-icon svg { width: 100%; height: 100%; display: block; overflow: visible; fill: none; }
    .gate-icon .ir {                       /* red neon strokes */
      stroke: currentColor;
      stroke-width: 2.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 2px #ff6a6a) drop-shadow(0 0 7px #ff1414)
              drop-shadow(0 0 16px rgba(255,0,0,0.85));
    }
    .gate-icon .ir-limb {                  /* solid neon-red limb */
      stroke: currentColor;
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 0 3px #ff6a6a) drop-shadow(0 0 9px #ff1414)
              drop-shadow(0 0 18px rgba(255,0,0,0.8));
    }
    .gate-icon .ir-fill {                  /* filled neon-red silhouette (no glow) */
      fill: currentColor;
      stroke: none;
    }
    .gate-icon .ir-finger {                /* fingers wrapping over the other hand */
      stroke: currentColor;
      stroke-width: 5.5;
      stroke-linecap: round;
      fill: none;
      filter: drop-shadow(0 0 3px #ff6a6a) drop-shadow(0 0 8px #ff1414);
    }
    .gate-icon .ir-fist {                  /* the clasped fist */
      stroke: currentColor;
      stroke-width: 21;
      stroke-linecap: round;
      fill: none;
      filter: drop-shadow(0 0 3px #ff6a6a) drop-shadow(0 0 10px #ff1414)
              drop-shadow(0 0 20px rgba(255,0,0,0.85));
    }
    .gate-icon .carve {                    /* dark grooves = finger separations */
      stroke: #150707;
      stroke-width: 2.4;
      stroke-linecap: round;
      fill: none;
    }
    .gate-icon .ig {                       /* 24k gold accent (no glow) */
      stroke: var(--au-white);
      fill: url(#gold24k);
      stroke-width: 1.1;
      vector-effect: non-scaling-stroke;
    }
    .gate-icon .ig-line { fill: none; stroke: url(#gold24kLine); stroke-width: 1.6; stroke-linecap: round;
      vector-effect: non-scaling-stroke; }
    /* gold stud on each cuff (24k accent, minimal) */
    .gate-icon .ig-dot {
      fill: url(#gold24k);
      stroke: var(--au-white);
      stroke-width: 0.7;
      vector-effect: non-scaling-stroke;
    }
    /* the upper hand is lighter + dark-edged so the two hands read as separate */
    .gate-icon .ir-fill.hand-top {
      fill: #ff8080;
      stroke: #1a0303;
      stroke-width: 2.2;
      stroke-linejoin: round;
      paint-order: stroke fill;
    }

    /* ---- burning diya flame ---- */
    .flame-wrap { transform-origin: 50px 52px; animation: flameSway 2.3s ease-in-out infinite; }
    .flame-outer { fill: url(#flameOuter); stroke: none;
      filter: drop-shadow(0 0 6px #ffa321) drop-shadow(0 0 16px #ff7b00)
              drop-shadow(0 0 32px rgba(255,110,0,0.9));
      animation: flameFlicker 0.42s ease-in-out infinite alternate; transform-origin: 50px 52px; }
    .flame-mid   { fill: url(#flameMid); stroke: none;
      filter: drop-shadow(0 0 5px #ffdf6e) drop-shadow(0 0 14px #ffc21e);
      animation: flameFlicker 0.33s ease-in-out infinite alternate-reverse; transform-origin: 50px 51px; }
    .flame-core  { fill: #fffef7; stroke: none;
      filter: drop-shadow(0 0 5px #fffbe4) drop-shadow(0 0 13px #fff0a8);
      animation: flameCore 0.55s ease-in-out infinite alternate; transform-origin: 50px 50px; }
    .flame-halo  { fill: url(#haloGold); stroke: none;
      animation: flameHalo 1.5s ease-in-out infinite; transform-origin: 50px 46px; }
    @keyframes flameFlicker {
      0%   { transform: scaleY(1)    scaleX(1);    opacity: 0.92; }
      100% { transform: scaleY(1.13) scaleX(0.93); opacity: 1; }
    }
    @keyframes flameCore {
      0%   { transform: scaleY(0.9) translateY(1px); opacity: 0.85; }
      100% { transform: scaleY(1.15) translateY(-1px); opacity: 1; }
    }
    @keyframes flameSway {
      0%,100% { transform: rotate(-2.5deg); }
      50%     { transform: rotate(2.5deg); }
    }
    @keyframes flameHalo {
      0%,100% { transform: scale(1);    opacity: 0.35; }
      50%     { transform: scale(1.22); opacity: 0.6; }
    }
    /* light thrown down into the lamp bowl */
    .diya-pool { animation: diyaPool 0.9s ease-in-out infinite alternate; }
    @keyframes diyaPool { 0% { opacity: 0.35; } 100% { opacity: 0.8; } }

    /* ---- handshake ---- */
    .shake-l { transform-origin: 20px 47px; animation: shakeL 1.6s ease-in-out infinite; }
    .shake-r { transform-origin: 79px 45px; animation: shakeR 1.6s ease-in-out infinite; }
    .shake-grip { animation: gripPulse 1.6s ease-in-out infinite; transform-origin: 50px 49px; }
    @keyframes shakeL {
      0%,100% { transform: translate(-2px, -1.5px); }
      18%     { transform: translate(0, 0); }
      34%     { transform: translate(0, 2.5px); }
      50%     { transform: translate(0, -1.5px); }
      66%     { transform: translate(0, 1.5px); }
      82%     { transform: translate(0, 0); }
    }
    @keyframes shakeR {
      0%,100% { transform: translate(2px, -1.5px); }
      18%     { transform: translate(0, 0); }
      34%     { transform: translate(0, 2.5px); }
      50%     { transform: translate(0, -1.5px); }
      66%     { transform: translate(0, 1.5px); }
      82%     { transform: translate(0, 0); }
    }
    @keyframes gripPulse {
      0%, 16%  { opacity: 0; transform: scale(0.4); }
      26%      { opacity: 1; transform: scale(1.35); }
      40%      { opacity: 0.8; transform: scale(1); }
      86%      { opacity: 0.8; transform: scale(1); }
      100%     { opacity: 0; transform: scale(0.5); }
    }
    #introRoot.stage-word-l .gate-left  .gate-icon,
    #introRoot.stage-word-r .gate-right .gate-icon {
      animation: gateIconIn 0.75s cubic-bezier(.2,.9,.25,1.2) forwards,
                 gateIconHum 2.6s ease-in-out 0.8s infinite;
    }
    @keyframes gateIconIn {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.62); }
      45%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      70%  { opacity: 0.55; }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes gateIconHum {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.3); }
    }
    #introRoot.stage-open .gate-icon,
    #introRoot.stage-open .gate-word,
    #introRoot.stage-open .gate-word-glow,
    #introRoot.stage-open .alpona {
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      .alpona .draw, .alpona .pip, .alpona .spin, .gate-word .ltr, .gate-icon,
      .flame-wrap, .flame-outer, .flame-mid, .flame-core, .flame-halo, .diya-pool,
      .shake-l, .shake-r, .shake-grip { animation: none !important; }
      .shake-grip { opacity: 1; }
      .gate-icon { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      .alpona .draw { stroke-dashoffset: 0; }
      .alpona .pip  { opacity: 0.9; }
      .gate-word .ltr { opacity: 1; color: #e63030; text-shadow: none; }
    }

    /* ---- intro: designing-related icons, animate + glow (3s sequence) ---- */
    .intro-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3.2vw, 22px);
      margin-top: clamp(6px, 1.6vh, 14px);
      pointer-events: none;
    }
    .intro-icons .ico {
      width: clamp(22px, 5.6vw, 34px);
      height: clamp(22px, 5.6vw, 34px);
      opacity: 0;
      transform: translateY(14px) scale(0.55) rotate(-25deg);
      color: #ff2a2a;
      filter: drop-shadow(0 0 0 rgba(255,60,60,0));
    }
    .intro-icons .ico svg { width: 100%; height: 100%; display: block; }
    .intro-icons .ico svg * { vector-effect: non-scaling-stroke; }
    /* each icon pops in, glows, then settles — whole run = 3s */
    #introRoot.stage-icons .intro-icons .ico {
      animation: introIcoIn 2.4s cubic-bezier(.2,.8,.25,1) forwards;
    }
    #introRoot.stage-icons .intro-icons .ico:nth-child(1) { animation-delay: 0s; }
    #introRoot.stage-icons .intro-icons .ico:nth-child(2) { animation-delay: 0.12s; }
    #introRoot.stage-icons .intro-icons .ico:nth-child(3) { animation-delay: 0.24s; }
    #introRoot.stage-icons .intro-icons .ico:nth-child(4) { animation-delay: 0.36s; }
    #introRoot.stage-icons .intro-icons .ico:nth-child(5) { animation-delay: 0.48s; }
    #introRoot.stage-icons .intro-icons .ico:nth-child(6) { animation-delay: 0.60s; }
    @keyframes introIcoIn {
      0%   { opacity: 0; transform: translateY(14px) scale(0.55) rotate(-25deg);
             color: #ff2a2a; filter: drop-shadow(0 0 0 rgba(255,60,60,0)); }
      18%  { opacity: 1; transform: translateY(-3px) scale(1.14) rotate(4deg);
             color: #ff6a6a; filter: drop-shadow(0 0 10px rgba(255,70,70,0.95)); }
      30%  { transform: translateY(0) scale(1) rotate(0deg); }
      55%  { color: #ffd280; filter: drop-shadow(0 0 18px rgba(255,180,60,1)); }
      78%  { color: #ff6a6a; filter: drop-shadow(0 0 9px rgba(255,70,70,0.85)); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg);
             color: #ff2a2a; filter: drop-shadow(0 0 6px rgba(255,60,60,0.6)); }
    }
    @media (prefers-reduced-motion: reduce) {
      #introRoot.stage-icons .intro-icons .ico {
        animation: none !important;
        opacity: 1;
        transform: none;
        filter: drop-shadow(0 0 6px rgba(255,60,60,0.6));
      }
    }

    /* ---- logo: fade + scale in, then only the RIGHT loop ("eye") blinks ---- */
    .intro-logo-wrap {
      position: relative;
      width: clamp(96px, 24vw, 148px);
      aspect-ratio: 485 / 386;
      opacity: 0;
      transform: scale(0.72);
      filter: drop-shadow(0 0 0 rgba(255,180,60,0));
      transition: opacity 0.7s cubic-bezier(.2,.7,.2,1), transform 0.8s cubic-bezier(.2,.7,.2,1), filter 1s ease;
    }
    .intro-logo-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
    #introRoot.stage-logo .intro-logo-wrap {
      opacity: 1;
      transform: scale(1);
      filter: drop-shadow(0 0 20px rgba(255,170,40,0.5));
    }
    /* right loop only — precisely matched to the mark's own right circle */
    .intro-eye-right {
      position: absolute;
      left: 49.5%;
      top: 13.5%;
      width: 50%;
      height: 63.5%;
      background: #050303;
      border-radius: 48% 52% 55% 45% / 50% 50% 50% 50%;
      transform: scaleY(0);
      transform-origin: center;
    }
    #introRoot.stage-blink .intro-eye-right {
      animation: eyelidBlink 0.5s ease-in-out 2;
    }
    @keyframes eyelidBlink {
      0%   { transform: scaleY(0); }
      35%  { transform: scaleY(1); }
      65%  { transform: scaleY(1); }
      100% { transform: scaleY(0); }
    }


    /* ---- glass-effect transition: layered glossy sheen + refraction blur ---- */
    .glass-sweep {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background:
        linear-gradient(102deg, transparent 26%, rgba(255,255,255,0.10) 40%, rgba(255,255,255,0.65) 49%, rgba(255,255,255,0.10) 58%, transparent 74%);
      backdrop-filter: blur(0px) saturate(100%);
      -webkit-backdrop-filter: blur(0px) saturate(100%);
      transform: translateX(-45%);
    }
    .glass-sweep::before {
      content: '';
      position: absolute;
      inset: -10%;
      background: linear-gradient(96deg, transparent 30%, rgba(120,210,255,0.16) 46%, transparent 54%);
      mix-blend-mode: screen;
      transform: translateX(-6%);
      pointer-events: none;
    }
    .glass-sweep::after {
      content: '';
      position: absolute;
      inset: -10%;
      background: linear-gradient(108deg, transparent 44%, rgba(255,190,110,0.18) 52%, transparent 66%);
      mix-blend-mode: screen;
      transform: translateX(6%);
      pointer-events: none;
    }
    #introRoot.stage-glass .glass-sweep {
      opacity: 1;
      animation: glassSweepMove 1.05s cubic-bezier(.3,.6,.2,1) forwards;
    }
    @keyframes glassSweepMove {
      0%   { transform: translateX(-50%); backdrop-filter: blur(0px) saturate(100%); -webkit-backdrop-filter: blur(0px) saturate(100%); opacity: 0; }
      12%  { opacity: 1; }
      45%  { backdrop-filter: blur(11px) saturate(165%); -webkit-backdrop-filter: blur(11px) saturate(165%); }
      88%  { opacity: 0.9; }
      100% { transform: translateX(50%); backdrop-filter: blur(0px) saturate(100%); -webkit-backdrop-filter: blur(0px) saturate(100%); opacity: 0; }
    }
    /* soft flash of light the instant the card locks into full focus */
    .glass-flash {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 48%, rgba(255,255,255,0.85) 0%, rgba(255,210,150,0.25) 30%, transparent 62%);
    }
    #introRoot.stage-glass .glass-flash {
      animation: glassFlashPulse 1.05s ease-out forwards;
    }
    @keyframes glassFlashPulse {
      0%, 40% { opacity: 0; }
      54%     { opacity: 0.9; }
      100%    { opacity: 0; }
    }


    #introRoot.stage-glass .intro-stage,
    #introRoot.stage-glass .gate-panel {
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    #introRoot.stage-fadeout { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }

    /* the card sits blurred/soft behind the gate, then sharpens into focus
       with a glossy, slightly-overshooting settle exactly as the glass
       sweep passes over it */
    body.intro-active .card-flip-container {
      filter: blur(22px) saturate(100%);
      opacity: 0.3;
      transform: scale(0.92);
      transition: filter 0.95s cubic-bezier(.2,.7,.2,1), opacity 0.8s ease, transform 1s cubic-bezier(.34,1.56,.64,1);
    }
    body.intro-active.intro-glass .card-flip-container {
      filter: blur(0) saturate(112%);
      opacity: 1;
      transform: scale(1);
    }

    .intro-skip {
      position: absolute;
      bottom: 18px;
      right: 16px;
      z-index: 10;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.8);
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 0.62rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 30px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease, background 0.2s ease;
      z-index: 6;
    }
    #introRoot.stage-open .intro-skip { opacity: 1; }
    .intro-skip:hover, .intro-skip:focus-visible { background: rgba(255,255,255,0.16); outline: none; }

    .replay-intro-btn {
      -webkit-appearance: none;
      appearance: none;
      position: fixed;
      bottom: 8px;
      left: 8px;
      z-index: 100;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.75);
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 0.56rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .replay-intro-btn i { font-size: 0.6rem; }
    .replay-intro-btn:hover, .replay-intro-btn:focus-visible { background: rgba(255,0,0,0.35); color: #fff; outline: none; }

    @media (prefers-reduced-motion: reduce) {
      .gate-panel, .intro-frame, .intro-logo-wrap, .intro-line, #introRoot { transition: none !important; animation: none !important; }
    }

    /* =====================================================================
       CARD WORDMARK ANIMATION — "ArtViSiøN" gets a soft breathing neon
       glow plus a periodic gold/white shimmer sweep across the letters.
       (No separate logo icon on the card — the wordmark carries the brand.)
       ===================================================================== */
    .neon-text {
      animation: neonGlowPulse 3.2s ease-in-out infinite;
    }
    @keyframes neonGlowPulse {
      0%, 100% {
        text-shadow:
          0 0 7px var(--main-red),
          0 0 14px var(--accent-red),
          0 0 8px var(--main-red);
      }
      50% {
        text-shadow:
          0 0 11px var(--main-red),
          0 0 20px var(--accent-red),
          0 0 15px var(--main-red),
          0 0 28px rgba(255,120,0,0.4);
      }
    }
    .neon-text::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg,
        transparent 22%,
        rgba(255,255,255,0.95) 42%,
        rgba(255,205,110,0.95) 50%,
        rgba(255,255,255,0.95) 58%,
        transparent 78%);
      background-size: 260% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
      mix-blend-mode: overlay;
      animation: neonShimmerSweep 3.8s ease-in-out infinite;
      animation-delay: 0.6s;
    }
    @keyframes neonShimmerSweep {
      0%   { background-position: 160% 0; opacity: 0; }
      10%  { opacity: 1; }
      48%  { background-position: -60% 0; opacity: 1; }
      60%  { opacity: 0; }
      100% { background-position: -60% 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .neon-text, .neon-text::before { animation: none !important; }
    }

    /* ---- the gear emoji in the wordmark rotates forever, like a real cog ---- */
    .gear-spin {
      display: inline-block;
      transform-origin: 50% 50%;
      animation: gearTurn 4s linear infinite;
      will-change: transform;
    }
    @keyframes gearTurn {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    /* visually hidden, keeps the wordmark readable for screen readers */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .gear-spin { animation: none !important; }
    }
  </style>
</head>

    /* ------------------------------------------------------------ */
    const Coin = (function () {
      let ctx = null;

      let last = 0;
      const VOLUME = 0.24;
      const MIN_GAP_MS = 75;

      // ---- SA RE GA MA PA DHA NI SA ----

      // tap 1 = Sa, tap 2 = Re, tap 3 = Ga ... tap 8 = Sa (high), then again.
      const SARGAM = [
        523.25, // Sa
        587.33, // Re
        659.25, // Ga
        698.46, // Ma
        783.99, // Pa
        880.00, // Dha
        987.77, // Ni

        if (ctx) return ctx;

        master = ctx.createGain();

        master.connect(ctx.destination);

        const echo = ctx.createDelay(0.6);
        echo.delayTime.value = 0.15;

        echoFb.gain.value = 0.30;
        const echoWet = ctx.createGain();
        echoWet.gain.value = 0.5;
        master.connect(echo);
        echo.connect(echoFb); echoFb.connect(echo);
        echo.connect(echoWet); echoWet.connect(ctx.destination);
        return ctx;

        const c = ensure();
        if (!c) return;
        if (c.state === 'suspended') c.resume();
        const t0 = c.currentTime + 0.001;

        // ---- 1) strike transient: the metallic "tick" of the hit ----
        const nLen = Math.floor(c.sampleRate * 0.045);
        const nBuf = c.createBuffer(1, nLen, c.sampleRate);
        const nd = nBuf.getChannelData(0);
        for (let i = 0; i < nLen; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nLen);
        const noise = c.createBufferSource();
        noise.buffer = nBuf;
        const hp = c.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 3600; hp.Q.value = 0.7;
        const ng = c.createGain();
        ng.gain.setValueAtTime(0.0001, t0);
        ng.gain.exponentialRampToValueAtTime(0.6, t0 + 0.005);
        ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
        noise.connect(hp); hp.connect(ng); ng.connect(master);
        noise.start(t0); noise.stop(t0 + 0.07);

          { ratio: 2.756, amp: 0.28, decay: 0.45 },
          { ratio: 5.404, amp: 0.12, decay: 0.30 },
          { ratio: 8.933, amp: 0.05, decay: 0.22 }

      }

      // the mute toggle only matters while the intro is playing; once stopped,
      // the rain stays silent no matter what the toggle does later.
      function setMuted(m) {
        muted = !!m;
        if (!running || !ctx || !master) return;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.value = muted ? 0 : MASTER;
      }

      return { start: start, stop: stop, setMuted: setMuted, ensure: ensure };
    })();

    /* ------------------------------------------------------------ */
    /* WATER DRIP ("tapak") - a short droplet plip that drips in    */
    /* sync with the intro design-icons popping in under the logo.  */
    /* Synthesized, offline: falling-pitch plip + tiny splash.      */
    /* ------------------------------------------------------------ */
    const WaterDrip = (function () {
      let ctx = null;
      let master = null;
      let muted = false;
      const VOLUME = 0.30;

      function ensure() {
        if (ctx) return ctx;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : VOLUME;
        master.connect(ctx.destination);
        return ctx;
      }

      function drip() {
        const c = ensure();
        if (!c) return;
        if (c.state === 'suspended') c.resume();
        const t0 = c.currentTime + 0.001;
        const f0 = 1250 + Math.random() * 450;   // each drip has its own pitch

        // the "plip": fast falling pitch like a droplet hitting water
        const osc = c.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f0, t0);
        osc.frequency.exponentialRampToValueAtTime(360, t0 + 0.09);
        const og = c.createGain();
        og.gain.setValueAtTime(0.0001, t0);
        og.gain.exponentialRampToValueAtTime(0.75, t0 + 0.012);
        og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
        osc.connect(og); og.connect(master);
        osc.start(t0); osc.stop(t0 + 0.26);

        // tiny splash hiss on impact
        const nLen = Math.floor(c.sampleRate * 0.05);
        const nBuf = c.createBuffer(1, nLen, c.sampleRate);
        const nd = nBuf.getChannelData(0);
        for (let i = 0; i < nLen; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nLen);
        const noise = c.createBufferSource();
        noise.buffer = nBuf;
        const nf = c.createBiquadFilter();
        nf.type = 'bandpass';
        nf.frequency.value = 2500;
        nf.Q.value = 1.3;
        const ng = c.createGain();
        ng.gain.setValueAtTime(0.0001, t0 + 0.008);
        ng.gain.exponentialRampToValueAtTime(0.13, t0 + 0.02);
        ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
        noise.connect(nf); nf.connect(ng); ng.connect(master);
        noise.start(t0); noise.stop(t0 + 0.11);
      }

      function setMuted(m) {
        muted = !!m;
        if (master) master.gain.value = muted ? 0 : VOLUME;
      }

      function play() {
        if (muted) return;
        try { drip(); } catch (e) { /* audio unavailable - stay silent */ }
      }

      return { play: play, ensure: ensure, setMuted: setMuted };
    })();

    /* ------------------------------------------------------------ */
    /* MUSIC BED FALLBACK - a synthesized drum & bass flavoured     */
    /* ambient loop that GUARANTEES background music always plays,  */
    /* even if SoundCloud is blocked / offline / slow. WebAudio,    */
    /* fully offline. Kick + snare + hats + bass + pad chords.      */
    /* ------------------------------------------------------------ */
    const MusicBed = (function () {
      let ctx = null;
      let master = null;
      let running = false;
      let muted = false;
      let timer = null;
      let nextTime = 0;
      let step = 0;
      const BPM = 140;
      const SPB = 60 / BPM;        // seconds per beat
      const STEP = SPB / 4;        // 16th-note steps
      const VOLUME = 0.26;

      // moody progression: A minor -> F -> C -> G (roots in Hz)
      const CHORDS = [
        { root: 110.00, minor: true  }, // A
        { root: 87.31,  minor: false }, // F
        { root: 130.81, minor: false }, // C
        { root: 98.00,  minor: false }  // G
      ];
      const BASS = [110.00, 110.00, 87.31, 98.00]; // one root per beat

      function ensure() {
        if (ctx) return ctx;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : VOLUME;
        master.connect(ctx.destination);
        return ctx;
      }

      function kick(t) {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(46, t + 0.12);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.9, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
        osc.connect(g); g.connect(master);
        osc.start(t); osc.stop(t + 0.42);
      }

      function hat(t, open) {
        const len = Math.floor(ctx.sampleRate * (open ? 0.12 : 0.035));
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 7500;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(open ? 0.16 : 0.11, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (open ? 0.12 : 0.04));
        src.connect(hp); hp.connect(g); g.connect(master);
        src.start(t); src.stop(t + (open ? 0.14 : 0.05));
      }

      function snare(t) {
        const len = Math.floor(ctx.sampleRate * 0.14);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.8;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        src.connect(bp); bp.connect(g); g.connect(master);
        src.start(t); src.stop(t + 0.18);
      }

      function bassNote(t, f) {
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, t);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 6;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.30, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + SPB * 0.92);
        osc.connect(lp); lp.connect(g); g.connect(master);
        osc.start(t); osc.stop(t + SPB * 0.95);
      }

      function padChord(t, chord) {
        const freqs = chord.minor
          ? [chord.root, chord.root * 1.1892, chord.root * 1.4983]   // min triad
          : [chord.root, chord.root * 1.2599, chord.root * 1.4983];  // maj triad
        for (let i = 0; i < freqs.length; i++) {
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freqs[i], t);
          osc.detune.value = (i - 1) * 6;
          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.6;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.055, t + 0.5);
          g.gain.setValueAtTime(0.055, t + SPB * 4 - 0.4);
          g.gain.linearRampToValueAtTime(0.0001, t + SPB * 4);
          osc.connect(lp); lp.connect(g); g.connect(master);
          osc.start(t); osc.stop(t + SPB * 4 + 0.1);
        }
      }

      function schedule() {
        if (!ctx || !running) return;
        while (nextTime < ctx.currentTime + 0.15) {
          const s = step % 16;
          const bar = Math.floor(step / 16) % 4;   // which chord of the progression
          const beat = Math.floor(s / 4);          // 0..3 within the bar
          const t = nextTime;

          if (s % 4 === 0) kick(t);        // four-on-floor kick
          if (s === 4 || s === 12) snare(t);  // snare on 2 & 4
          if (s % 2 === 1) hat(t, false);  // off-beat eighths
          if (s === 14) hat(t, true);      // open hat pickup
          bassNote(t, BASS[beat]);         // bass root each beat
          if (s === 0) padChord(t, CHORDS[bar]); // pad each bar

          nextTime += STEP;
          step++;
        }
      }

      function start() {
        ensure();
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume();
        if (running) return;
        running = true;
        nextTime = ctx.currentTime + 0.06;
        step = 0;
        timer = setInterval(schedule, 45);
      }

      function stop() {
        running = false;
        if (timer) { clearInterval(timer); timer = null; }
      }

      function setMuted(m) {
        muted = !!m;
        if (master) master.gain.value = muted ? 0 : VOLUME;
      }

      return { start: start, stop: stop, setMuted: setMuted, ensure: ensure };
    })();

    (function(){
      const cardFlip = document.getElementById('card-flip');
      const fireflyEl = document.querySelector('.firefly');
      if (!cardFlip || !fireflyEl) return;

      // lock in the exact scale the firefly is rendered at inside the jar (see
      // .firefly-mini-container's inline "scale(0.13)") so its size never changes once released.
      const FIXED_SCALE = 0.13;
      const homeParent = fireflyEl.parentElement;
      const homeNextSibling = fireflyEl.nextSibling;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let hasPointer = false;
      document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; hasPointer = true; });
      document.addEventListener('pointermove', (e) => { mouseX = e.clientX; mouseY = e.clientY; hasPointer = true; }, { passive: true });
      document.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches[0]) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; hasPointer = true; }
      }, { passive: true });

      // The .firefly anchor is a 0x0 box, so "translate(-50%,-50%)" cannot centre it and
      // the glowing body actually renders well below/right of that anchor. Measure the real
      // offset once so the GLOW (not the invisible anchor) is what tracks the cursor.
      let glowOffX = 0, glowOffY = 0;
      let curScale = FIXED_SCALE;   // smoothed current scale (breathing depth)
      function paint(x, y, rotateDeg, scale) {
        const s = scale || FIXED_SCALE;
        const r = rotateDeg ? ` rotate(${rotateDeg}deg)` : '';
        // the glow offset scales linearly with the firefly, so rescale it too -
        // otherwise the glow drifts off the cursor as the firefly grows/shrinks.
        const k = s / FIXED_SCALE;
        fireflyEl.style.transform =
          `translate(${x - glowOffX * k}px, ${y - glowOffY * k}px) translate(-50%, -50%)${r} scale(${s})`;
      }
      // Calibrate against the REAL rendered geometry: paint once with no correction,
      // see where the glow actually landed, and keep that delta. Measuring the children
      // directly would read their unscaled vmin sizes and be ~10x too large.
      function measureGlowOffset(atX, atY) {
        const glow = fireflyEl.querySelector('.bodybottom') || fireflyEl.querySelector('.body');
        if (!glow) return;
        glowOffX = 0; glowOffY = 0;
        paint(atX, atY, 0);                       // same frame - never painted to screen
        const gr = glow.getBoundingClientRect();
        glowOffX = (gr.left + gr.width / 2) - atX;
        glowOffY = (gr.top + gr.height / 2) - atY;
      }

      let state = 'jar'; // 'jar' | 'free' | 'fleeing'
      let releaseTimer = null;
      let rafId = null;
      let curX = 0, curY = 0;
      let angle = Math.random() * Math.PI * 2;

      function releaseFirefly() {
        if (state !== 'jar') return;
        // start from where the glow currently sits inside the jar, so there is no jump
        const glow = fireflyEl.querySelector('.bodybottom') || fireflyEl.querySelector('.body');
        const gr = (glow || fireflyEl).getBoundingClientRect();
        curX = gr.left + gr.width / 2;
        curY = gr.top + gr.height / 2;
        document.body.appendChild(fireflyEl);
        fireflyEl.classList.add('roaming');
        fireflyEl.style.transition = 'none';
        measureGlowOffset(curX, curY);
        curScale = FIXED_SCALE;
        paint(curX, curY, 0);
        state = 'free';
        rafId = requestAnimationFrame(loop);
      }

      function loop(now) {
        if (state !== 'free') return;
        angle += 0.05;

        // the firefly slowly swings OUT from the cursor (far) and back IN (near),
        // like a real insect hovering - this drives the "door jaa raha / paas aa
        // raha" feel together with the scale below.
        const orbitRadius = 18 + 92 * (0.5 + 0.5 * Math.sin(now / 1500));
        const baseX = hasPointer ? mouseX : window.innerWidth / 2;
        const baseY = hasPointer ? mouseY : window.innerHeight / 2;
        const targetX = baseX + Math.cos(angle) * orbitRadius;
        const targetY = baseY + Math.sin(angle * 1.3) * orbitRadius * 0.6;

        // chase hard enough to keep up with fast cursor movement
        const dx = targetX - curX;
        const dy = targetY - curY;
        const dist = Math.hypot(dx, dy);
        const ease = dist > 220 ? 0.22 : dist > 90 ? 0.15 : 0.10;
        curX += dx * ease;
        curY += dy * ease;

        // ---- depth (bada / chhota): the closer to the cursor, the BIGGER;
        // the farther it swings away, the SMALLER it gets - perspective feel.
        const distToMouse = Math.hypot(curX - baseX, curY - baseY);
        const depth = Math.min(1, distToMouse / 120);            // 0 = near, 1 = far
        const targetScale = FIXED_SCALE * (1.65 - 0.75 * depth); // ~1.65x near, ~0.9x far
        curScale += (targetScale - curScale) * 0.10;             // smooth breathing, no jitter

        // bank into the direction of travel, like a real insect
        const tilt = Math.max(-22, Math.min(22, dx * 0.6)) + Math.sin(now / 500) * 5;
        paint(curX, curY, tilt, curScale);
        rafId = requestAnimationFrame(loop);

        const dx = curX - window.innerWidth / 2;
        const dy = curY - window.innerHeight / 2;

        if (Math.abs(dx) > Math.abs(dy)) {
          targetX = dx > 0 ? window.innerWidth + 200 : -200;
          targetY = curY - 250 - Math.random() * 150;
        } else {
          targetX = curX + (Math.random() - 0.5) * 200;
          targetY = dy > 0 ? window.innerHeight + 200 : -200;
        }
        fireflyEl.style.transition = 'transform 0.8s cubic-bezier(.4,0,.6,1)';
        paint(targetX, targetY, 0);
        setTimeout(() => {
          fireflyEl.classList.remove('roaming');
          fireflyEl.removeAttribute('style');
          if (homeNextSibling) { homeParent.insertBefore(fireflyEl, homeNextSibling); }
          else { homeParent.appendChild(fireflyEl); }
          state = 'jar';
        }, 820);
      }

      function toggleFlip() {
        cardFlip.classList.toggle('flipped');
        const isFlipped = cardFlip.classList.contains('flipped');
        if (isFlipped) {
          if (releaseTimer) clearTimeout(releaseTimer);
          releaseTimer = setTimeout(releaseFirefly, 2800);
        } else {
          if (releaseTimer) { clearTimeout(releaseTimer); releaseTimer = null; }
          if (state === 'free') fleeFirefly();
        }
      }
      cardFlip.addEventListener('click', toggleFlip);
      cardFlip.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          toggleFlip();
        }
      });
    })();


    /* =====================================================================
       GATE + 5-SECOND INTRO SEQUENCE CONTROLLER
       Timeline: black door opens (~0.2s-1.2s) -> logo fades/scales in and
       settles -> logo does a quick double eye-blink -> a glass-blur sweep
       transitions the scene while the digital card sharpens into focus
       underneath -> intro fades away. Total run time ~4.8-5s.
       ===================================================================== */
    (function () {
      const root = document.getElementById('introRoot');
      const skipBtn = document.getElementById('introSkip');
      const replayBtn = document.getElementById('replayIntroBtn');
      if (!root) return;

      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let stageTimers = [];

      function clearTimers() {
        stageTimers.forEach(clearTimeout);
        stageTimers = [];
      }

      function runIntro() {
        clearTimers();
        root.classList.remove('stage-alpona', 'stage-word-l', 'stage-word-r', 'stage-open', 'stage-logo', 'stage-icons', 'stage-blink', 'stage-glass', 'stage-fadeout', 'intro-done');
        document.documentElement.classList.add('intro-lock');
        document.body.classList.add('intro-active');
        document.body.classList.remove('intro-glass');
        root.style.display = 'block';
        root.style.opacity = '1';
        root.setAttribute('aria-hidden', 'false');

        if (reduceMotion) {
          // respect reduced-motion: skip straight to the card, no animation
          finishIntro();
          return;
        }

        Forest.start();   // soft nature ambience plays through the intro only
        Rain.start();     // soft barish patters along with the matrix-rain backdrop

        stageTimers.push(setTimeout(() => root.classList.add('stage-alpona'), 250));  // bengali alpona draws on both leaves
        stageTimers.push(setTimeout(() => root.classList.add('stage-word-l'), 1500)); // LEFT gate: WELCOME strikes on (red)
        stageTimers.push(setTimeout(() => root.classList.add('stage-word-r'), 3100)); // RIGHT gate: CONNECTION strikes on (red)
        stageTimers.push(setTimeout(() => root.classList.add('stage-open'), 5100));   // only now the doors part
        stageTimers.push(setTimeout(() => root.classList.add('stage-logo'), 5900));  // logo settles in
        stageTimers.push(setTimeout(() => {
          root.classList.add('stage-icons'); // design icons pop + glow (3s run)
          // pani ke tapakne ki awaaz: har icon ke pop ke saath ek droplet
          // (CSS nth-child delays: 0s, .12s, .24s, .36s, .48s, .60s)
          const iconDripOffsets = [350, 470, 590, 710, 830, 950]; // ms, matches pops
          iconDripOffsets.forEach(offset => {
            stageTimers.push(setTimeout(() => WaterDrip.play(), offset));
          });
        }, 5900));
        stageTimers.push(setTimeout(() => root.classList.add('stage-blink'), 6700)); // right eye blinks twice
        stageTimers.push(setTimeout(() => {                                          // glass-effect transition begins
          root.classList.add('stage-glass');
          document.body.classList.add('intro-glass');                               // card sharpens into focus
        }, 7900));
        stageTimers.push(setTimeout(() => root.classList.add('stage-fadeout'), 8900)); // intro fully fades
        stageTimers.push(setTimeout(finishIntro, 9800));                              // card fully revealed
      }

      function finishIntro() {
        clearTimers();
        Forest.stop();          // fade the forest out...
        Rain.stop();            // ...and the barish fades out with it
        startBackgroundMusic(); // ...then the background track drops in
        root.classList.add('intro-done');
        root.style.display = 'none';
        root.setAttribute('aria-hidden', 'true');
        document.documentElement.classList.remove('intro-lock');
        document.body.classList.remove('intro-active', 'intro-glass');
      }

      if (skipBtn) skipBtn.addEventListener('click', (e) => { e.stopPropagation(); finishIntro(); });
      if (replayBtn) replayBtn.addEventListener('click', (e) => { e.stopPropagation(); runIntro(); });

      window.addEventListener('load', runIntro);
    })();

    setTimeout(matrixRain, 50);

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 400) event.preventDefault();
      lastTouchEnd = now;
    }, false);
  </script>
