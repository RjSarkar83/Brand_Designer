<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RJ Sarkar - Visual/Brand Designer 2026</title>
  <meta name="viewport" content="width=360, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="🏁 🚀 ♾️ ArtViSiON: PRODUCTiōn̄ DESiGN ✨"Your Vision, Our Creation"✨ 📢 ADVERTiSiNG | 🏷️ BRANDiNG | 🧠 CREATiVE | 🎨 DESiGNiNG | ✂️ EDiTiNG | 🔥 FUSiON | 🖼️ GRAPHiCS">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --main-red: #ff0000;
      --accent-red: #ff3333;
      --calculator-dark: #1a0a0a;
      --calculator-btn: #ff1c38;
      --calculator-btn-hover: #fff;
      --calculator-btn-text: #fff;
      --calculator-btn-hover-text: #e0002b;
      --btn-radius: 28px;
      --white: #fff;
      --btn-shadow: 0 2px 22px rgba(255,0,0,0.17);
      --focus-outline: 2px solid #fff;
      --focus-shadow: 0 0 0 2px var(--accent-red);
      --matrix-green: #0f0;
      --darkgrey: transparent;
      --lightgrey: #470000;
      --lightestgrey: #472d2d;
      --red: #870000;
      --yellow: #ff0000;
      --nearlyblack: #a80b00;
      --lightyellow: #fff;
      --grey: #ff0000;
      --card-w: clamp(272px, 88vw, 340px);
      --card-ratio: 2 / 3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100vw;
      min-height: 100vh;
      font-family: 'Montserrat', Arial, sans-serif;
      color: var(--white);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      padding: 0;
      margin: 0;
      position: relative;
      z-index: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0e0909 0%, #211919 33%, #2b0e13 66%, #ff0000 100%);
      background-size: 200% 200%;
      animation: bggradientmove 6s ease-in-out infinite alternate;
    }
    @keyframes bggradientmove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .holo-grid {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,0,0,0.14) 0 2px, transparent 2px 50px),
        repeating-linear-gradient(90deg, rgba(255,0,0,0.12) 0 2px, transparent 2px 50px);
      z-index: 2;
      animation: gridPulse 5s ease-in-out infinite alternate;
      opacity: 0.19;
      background-size: 50px 50px;
      will-change: opacity;
      mix-blend-mode: lighten;
    }
    @keyframes gridPulse {
      0%, 100% { opacity: 0.14; }
      50% { opacity: 0.32; }
    }
    #matrix-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.2;
      background: transparent;
      mix-blend-mode: lighten;
    }
    .container {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      z-index: 10;
      padding-bottom: 30px;
      border: 0px solid var(--main-red);
      box-sizing: border-box;
    }
    .card-container {
      width: var(--card-w);
      aspect-ratio: var(--card-ratio);
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 0 auto;
      z-index: 10;
    }
    .business-card {
      position: relative;
      width: var(--card-w);
      aspect-ratio: var(--card-ratio);
      height: auto;
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(26,10,10,0.5) 0%, rgba(15,15,15,0.5) 50%, rgba(26,10,10,0.5) 100%);
      background-clip: padding-box;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      box-sizing: border-box;
      overflow: visible;
      box-shadow: 0 8px 36px 0 rgba(255,0,0,0.35), 0 0 0 1px rgba(255,0,0,0.15);
      z-index: 10;
    }
    .calculator-screen {
      width: 92%;
      min-height: 150px;
      max-height: 170px;
      margin: 0 auto;
      margin-top: 22px;
      margin-bottom: 14px;
      background: linear-gradient(135deg, rgba(25,0,0,0.42) 0%, rgba(25,0,0,0.45) 50%, rgba(25,0,0,0.42) 100%);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      box-shadow: 
        0 4px 28px 0 rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,0,0,0.15),
        0 0 0 1px rgba(255,0,0,0.08);
      position: relative;
      padding: 1.1rem 1.1rem 0.7rem 1.1rem;
      overflow: hidden;
      backdrop-filter: blur(5px) saturate(210%);
      -webkit-backdrop-filter: blur(5px) saturate(210%);
      border: 1.5px solid rgba(255,0,0,0.18);
    }
    .glass-shine {
      position: absolute;
      top: -60%;
      left: -60%;
      width: 200%;
      height: 120%;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(120deg, rgba(255,0,0,0.35) 0%, rgba(255,0,0,0.15) 20%, rgba(255,0,0,0.12) 50%, rgba(255,0,0,0.25) 70%);
      transform: rotate(-13deg);
      -webkit-transform: rotate(-13deg);
      animation: shineMove 4.5s linear infinite;
      border-radius: 15px;
      opacity: 0.7;
      filter: blur(6px);
      -webkit-filter: blur(6px);
      mix-blend-mode: lighten;
      transition: filter 0.2s, opacity 0.2s;
    }
    @keyframes shineMove {
      0% { top: -60%; left: -60%; }
      60% { top: 10%; left: 30%; opacity: 1; }
      100% { top: 140%; left: 110%; opacity: 0.6; }
    }
    .neon-text {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 6.5vw, 2.15rem);
      color: #fff;
      letter-spacing: 1.5px;
      margin-bottom: 0.17rem;
      word-break: break-word;
      line-height: 1.15;
      text-shadow:
        0 0 7px var(--main-red),
        0 0 14px var(--accent-red),
        0 0 8px var(--main-red);
      transition: color 0.2s;
      z-index: 3;
      position: relative;
    }
    .subtitle {
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: clamp(0.85rem, 3.4vw, 1rem);
      color: var(--accent-red);
      opacity: 0.92;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.04rem;
      font-weight: 400;
      z-index: 3;
      position: relative;
    }
    .year-animate {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.13rem;
      margin-bottom: 0.09rem;
      min-height: 2.0rem;
      z-index: 3;
      position: relative;
    }
    .year-digit {
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(0.95rem, 3.4vw, 1.08rem);
      color: #fff;
      animation: funny-bounce 4s infinite alternate cubic-bezier(.44,1.36,.89,.62);
      text-shadow: none;
      margin: 0 1px;
      letter-spacing: 1px;
    }
    .year-digit:nth-child(2) { animation-delay: 0.15s;}
    .year-digit:nth-child(3) { animation-delay: 0.3s;}
    .year-digit:nth-child(4) { animation-delay: 0.45s;}
    @keyframes funny-bounce {
      0% { transform: translateY(0) rotate(-5deg) scale(1);}
      30% { transform: translateY(-5px) rotate(5deg) scale(1.08);}
      60% { transform: translateY(0) rotate(-3deg) scale(1);}
      100% { transform: translateY(-7px) rotate(8deg) scale(1.1);}
    }
    .screen-headline-bar {
      width: 100%;
      background: transparent;
      color: #fff;
      z-index: 10;
      overflow: hidden;
      min-height: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 400;
      font-size: 0.97rem;
      padding: 0;
      margin-top: 9px;
      position: relative;
      border-radius: 15px;
      letter-spacing: 0.02em;
      justify-content: center;
    }
    .screen-scroll-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen-scroll-text {
      display: flex;
      align-items: center;
      font-size: clamp(0.82rem, 2.8vw, 0.95rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 24px;
      height: 24px;
      color: #fff;
      text-shadow: 0 0 6px #000, 0 0 1px var(--accent-red);
      font-family: 'Montserrat', Arial, sans-serif;
      position: relative;
      z-index: 3;
    }
    .scrolling-text-inner {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: clamp(10px, 3.2vw, 18px) clamp(10px, 3.2vw, 18px);
      width: 92%;
      margin: 0 auto 0.17rem auto;
      z-index: 2;
      padding: 0 7px;
    }
    .contact-btn, .offer-btn {
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
      width: 100%;
      padding: clamp(0.72rem, 2.6vw, 0.98rem) 0.14rem;
      border-radius: 50px;
      border: none;
      background: linear-gradient(100deg, var(--main-red) 80%, #ff3333 100%);
      color: var(--calculator-btn-text);
      font-weight: 400;
      font-size: 0.93rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.31rem;
      cursor: pointer;
      transition: background 0.17s, color 0.17s, box-shadow 0.18s;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      min-height: clamp(44px, 11.5vw, 48px);
      max-height: 60px;
      outline: none;
      text-align: center;
      box-sizing: border-box;
      box-shadow: var(--btn-shadow);
      margin: 0;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Montserrat', Arial, sans-serif;
    }
    .contact-btn:focus, .offer-btn:focus {
      outline: var(--focus-outline);
      box-shadow: var(--focus-shadow);
    }
    .contact-btn::before, .offer-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.11) 50%, transparent 100%);
      transition: left 0.5s;
      z-index: 1;
      pointer-events: none;
    }
    .contact-btn:hover::before, .offer-btn:hover::before { left: 100%; }
    .contact-btn:hover, .contact-btn:focus-visible,
    .offer-btn:hover, .offer-btn:focus-visible {
      background: var(--calculator-btn-hover);
      color: var(--calculator-btn-hover-text);
      box-shadow: 0 3px 14px 0px var(--accent-red), var(--btn-shadow);
      z-index: 2;
    }
    .contact-btn:hover i, .contact-btn:focus-visible i,
    .contact-btn:hover span, .contact-btn:focus-visible span,
    .offer-btn:hover i, .offer-btn:focus-visible i,
    .offer-btn:hover span, .offer-btn:focus-visible span {
      color: #e0002b !important;
    }
    .contact-btn i, .offer-btn i {
      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      color: #fff;
      min-width: 1.1rem;
    }
    .contact-btn span, .offer-btn span {
      font-size: clamp(0.7rem, 2.4vw, 0.8rem);
      line-height: .5;
      z-index: 2;
      color: inherit;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0.01em;
      margin-left: 1px;
    }
    .offer-btn {
      min-width: 0;
      width: 100%;
      margin: 0;
      padding: 0.98rem 0.14rem 0.98rem 0.14rem;
    }
    .floating-elements {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 3;
    }
    .floating-icon {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.13;
      color: var(--main-red);
      animation: floatIcon 5s infinite ease-in-out;
      pointer-events: none;
    }
    .floating-icon.fa-code { top: 12%; left: 10%; animation-delay: 0s;}
    .floating-icon.fa-palette { top: 30%; right: 7%; animation-delay: 10s;}
    .floating-icon.fa-rocket { top: 65%; left: 8%; animation-delay: 20s;}
    .floating-icon.fa-star { top: 82%; right: 23%; animation-delay: 30s;}
    .floating-icon.fa-heart { top: 47%; right: 5%; animation-delay: 40s;}
    .floating-icon.fa-lightbulb { top: 15%; right: 30%; animation-delay: 3.2s;}
    .floating-icon.fa-magic { top: 75%; left: 25%; animation-delay: 5.3s;}
    .floating-icon.fa-music { top: 50%; left: 40%; animation-delay: 2.6s;}
    .floating-icon.fa-gamepad { top: 80%; left: 70%; animation-delay: 3.2s;}
    .floating-icon.fa-glasses { top: 20%; right: 45%; animation-delay: 4.1s;}
    .floating-icon.fa-calculator { top: 35%; left: 60%; animation-delay: 1.3s;}
    .floating-icon.fa-equals { top: 60%; right: 18%; animation-delay: 2.9s;}
    .floating-icon.fa-divide { top: 25%; left: 20%; animation-delay: 3.8s;}
    .floating-icon.fa-square-root-alt { top: 70%; right: 5%; animation-delay: 1.7s;}
    .floating-icon.fa-plus { top: 25%; right: 15%; animation-delay: 2.5s;}
    .floating-icon.fa-minus { top: 80%; left: 15%; animation-delay: 2.2s;}
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.13; }
      50% { transform: translateY(-18px) rotate(180deg); opacity: 0.05; }
    }

    /* ---------- Services floating background ---------- */
    .services-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 3;
    }
    .service-chip {
      position: absolute;
      bottom: -60px;
      white-space: nowrap;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 500;
      font-size: clamp(0.6rem, 2vw, 0.7rem);
      letter-spacing: 0.03em;
      color: #ffc9c9;
      background: rgba(255, 0, 0, 0.07);
      border: 1px solid rgba(255, 51, 51, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      text-shadow: 0 0 5px rgba(255, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      animation-name: chipFloat;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      will-change: transform, opacity;
    }
    .service-chip.long {
      white-space: normal;
      max-width: 190px;
      text-align: center;
      font-size: clamp(0.56rem, 1.9vw, 0.63rem);
      line-height: 1.35;
      padding: 8px 12px;
    }
    @keyframes chipFloat {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      8%   { opacity: 0.8; }
      88%  { opacity: 0.8; }
      100% { transform: translateY(-130vh) translateX(var(--drift, 0px)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .service-chip { animation: none; opacity: 0; }
    }
    /* ---------------------------------------------------- */

    .share-fab {
      -webkit-appearance: none;
      appearance: none;
      position: fixed;
      bottom: 32px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: linear-gradient(45deg, var(--main-red), var(--accent-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(255,0,0,0.23);
      transition: all 0.15s ease;
      border: none;
      font-size: 0.85rem;
      outline: none;
    }
    .share-fab:focus { outline: var(--focus-outline); box-shadow: var(--focus-shadow); }
    .share-fab:hover, .share-fab:focus-visible {
      transform: scale(1.07) rotate(360deg);
      box-shadow: 0 4px 12px rgba(255,0,0,0.28);
    }
    .quantum-cursor {
      pointer-events: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,0,0,0.09) 0%, rgba(255,0,0,0.03) 40%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: all 0.1s ease;
      mix-blend-mode: screen;
      animation: quantumPulse 2s infinite;
    }
    @keyframes quantumPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.11); }
    }
    .toast {
      position: fixed;
      bottom: 60px;
      right: 8px;
      background: linear-gradient(45deg, var(--main-red), var(--accent-red));
      color: white;
      padding: 0.34rem 0.7rem;
      border-radius: 15px;
      font-weight: 600;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.5s ease;
      box-shadow: 0 2px 8px rgba(255,0,0,0.13);
      font-size: 0.67rem;
    }
    .card-flip-container {
      perspective: 1200px;
      -webkit-perspective: 1200px;
      width: var(--card-w);
      aspect-ratio: var(--card-ratio);
      height: auto;
      position: relative;
    }
    .card-flip {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.8s ease-in-out;
      position: relative;
    }
    .card-flip.flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 15px;
      overflow: hidden;
    }
    .card-face.back {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
      background: linear-gradient(135deg, #000000, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      flex-direction: column;
    }
    .typing-box {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.85rem, 3.2vw, 1rem);
      color: #fff;
      text-shadow: 0 0 6px #ff0000, 0 0 10px #ff3333;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #ff3333;
      width: 100%;
      max-width: 280px;
      animation: typing 5s steps(30, end), blink 0.75s step-end infinite;
    }
    @keyframes typing { from { width: 0; } to { width: 100%; } }
    @keyframes blink { 50% { border-color: transparent; } }
    #audio-toggle {
      -webkit-appearance: none;
      appearance: none;
      position: fixed;
      bottom: 60px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: linear-gradient(45deg, var(--main-red), var(--accent-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(255,0,0,0.23);
      transition: all 0.15s ease;
      border: none;
      font-size: 0.85rem;
      outline: none;
    }
    #audio-toggle:focus { outline: var(--focus-outline); box-shadow: var(--focus-shadow); }
    #audio-toggle:hover, #audio-toggle:focus-visible {
      transform: scale(1.07) rotate(360deg);
      box-shadow: 0 4px 12px rgba(255,0,0,0.28);
    }
    .firefly-mini-container {
      position: relative;
      width: 80vmin;
      height: 80vmin;
      font-family: 'Playfair Display', serif;
    }
    .firefly-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .jar {
      position: absolute;
      width: 60vmin;
      height: 60vmin;
      background: var(--lightgrey);
      border-bottom-left-radius: 10vmin;
      border-bottom-right-radius: 10vmin;
      top: 30vmin;
      left: 10vmin;
    }
    .jartop {
      position: absolute;
      width: 48vmin;
      height: 20vmin;
      background: var(--lightgrey);
      top: -21vmin;
      left: 6vmin;
      z-index: 1;
    }
    .jarlid {
      position: absolute;
      width: 55vmin;
      height: 6vmin;
      background: var(--lightestgrey);
      border-radius: 10vmin;
      top: -28vmin;
      left: 2.3vmin;
      transform-origin: 100% 100%;
    }
    .wording {
      position: absolute;
      left: 2vmin;
      font-size: 10vmin;
      color: #ff0000;
      user-select: none;
    }
    .help { transform: rotate(-20deg); opacity: 1; transition: opacity 2s; transition-delay: 1s; }
    .thanks { transform: rotate(0deg); opacity: 0; left: 0vmin; top: 10vmin; }
    .firefly { position: absolute; width: 0vmin; height: 0vmin; left: 10vmin; top: +10vmin; z-index: 1; }

      let frameCount = 0;
      const canvas = document.getElementById("matrix-canvas");
      const ctx = canvas.getContext("2d");
      function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      const chars = "रंजन सरकार DESIGN विज़ुअल ART ABC abc 123";
      const fontSize = 18;
      let columns = Math.floor(window.innerWidth / fontSize);
      let drops = Array(columns).fill(1);
      let stars = [];
      function createStar() {
        if (Math.random() > 0.985) {
          stars.push({ x: Math.random() * canvas.width, y: canvas.height + 10, size: Math.random() * 2 + 1, speed: Math.random() * 1.5 + 0.5, opacity: Math.random() * 0.8 + 0.2, twinkle: Math.random() * Math.PI * 2 });
        }
      }
      function drawStars() {
        for (let i = stars.length - 1; i >= 0; i--) {
          const s = stars[i];
          s.y -= s.speed * 0.6;
          s.twinkle += 0.05;
          if (s.y < -20) stars.splice(i, 1);
          const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 3);
          glow.addColorStop(0, "#fff");
          glow.addColorStop(0.3, "#fcc");
          glow.addColorStop(1, "rgba(255,0,0,0)");
          ctx.globalAlpha = s.opacity * (Math.sin(s.twinkle * 2) * 0.4 + 0.6);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      function draw() {
        frameCount++;
        if (frameCount % 3 !== 0) { requestAnimationFrame(draw); return; }
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          ctx.fillStyle = Math.random() > 0.975 ? "#fb0" : "#ff4444";
          ctx.shadowColor = "#ff0000";
          ctx.shadowBlur = 3;
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.965) drops[i] = 0;
          drops[i] += 0.35;
        }
        createStar();
        drawStars();
        requestAnimationFrame(draw);
      }
      draw();
    }
