<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RJ Sarkar - Brand & Production Designer 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="🏁 🚀 ♾️ ArtViSiON: PRODUCTiōn̄ DESiGN ✨ &quot;Your Vision, Our Creation&quot; ✨ 📢 ADVERTiSiNG | 🏷️ BRANDiNG | 🧠 CREATiVE | 🎨 DESiGNiNG | ✂️ EDiTiNG | 🔥 FUSiON | 🖼️ GRAPHiCS">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --main-red: #ff0000;
      --accent-red: #ff3333;
      --calculator-dark: #1a0a0a;
      --calculator-btn: #ff1c38;
      --calculator-btn-hover: #fff;
      --calculator-btn-text: #fff;
      --calculator-btn-hover-text: #e0002b;
      --btn-radius: 28px;
      --white: #fff;
      --btn-shadow: 0 2px 22px rgba(255,0,0,0.17);
      --focus-outline: 2px solid #fff;
      --focus-shadow: 0 0 0 2px var(--accent-red);
      --matrix-green: #0f0;
      --darkgrey: transparent;
      --lightgrey: #470000;
      --lightestgrey: #472d2d;
      --red: #870000;
      --yellow: #ff0000;
      --nearlyblack: #a80b00;
      --lightyellow: #fff;
      --grey: #ff0000;
      --card-w: clamp(272px, 88vw, 340px);
      --card-ratio: 2 / 3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100vw;
      min-height: 100vh;
      font-family: 'Montserrat', Arial, sans-serif;
      color: var(--white);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      padding: 0;
      margin: 0;
      position: relative;
      z-index: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0e0909 0%, #211919 33%, #2b0e13 66%, #ff0000 100%);
      background-size: 200% 200%;
      animation: bggradientmove 6s ease-in-out infinite alternate;
    }
    @keyframes bggradientmove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .holo-grid {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,0,0,0.14) 0 2px, transparent 2px 50px),
        repeating-linear-gradient(90deg, rgba(255,0,0,0.12) 0 2px, transparent 2px 50px);
      z-index: 2;
      animation: gridPulse 5s ease-in-out infinite alternate;
      opacity: 0.19;
      background-size: 50px 50px;
      will-change: opacity;
      mix-blend-mode: lighten;
    }
    @keyframes gridPulse {
      0%, 100% { opacity: 0.14; }
      50% { opacity: 0.32; }
    }
    #matrix-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      opacity: 0.2;
      background: transparent;
      mix-blend-mode: lighten;
    }
    .container {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      z-index: 10;
      padding-bottom: 30px;
      border: 0px solid var(--main-red);
      box-sizing: border-box;
    }
    .card-container {
      width: var(--card-w);
      aspect-ratio: var(--card-ratio);
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 0 auto;
      z-index: 10;
    }
    .business-card {
      position: relative;
      width: var(--card-w);
      aspect-ratio: var(--card-ratio);
      height: auto;
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(26,10,10,0.5) 0%, rgba(15,15,15,0.5) 50%, rgba(26,10,10,0.5) 100%);
      background-clip: padding-box;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      box-sizing: border-box;
      overflow: visible;
      box-shadow: 0 8px 36px 0 rgba(255,0,0,0.35), 0 0 0 1px rgba(255,0,0,0.15);
      z-index: 10;
    }
    .calculator-screen {
      width: 92%;
      min-height: 150px;
      max-height: 170px;
      margin: 0 auto;
      margin-top: 22px;
      margin-bottom: 14px;
      background: linear-gradient(135deg, rgba(125,0,0,0.42) 0%, rgba(25,0,0,0.45) 50%, rgba(125,0,0,0.42) 100%);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      box-shadow: 
        0 4px 28px 0 rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.22),
        inset 0 -12px 20px -12px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,0,0,0.08);
      position: relative;
      padding: 1.1rem 1.1rem 0.7rem 1.1rem;
      overflow: hidden;
      backdrop-filter: blur(5px) saturate(210%);
      -webkit-backdrop-filter: blur(5px) saturate(210%);
      border: 1.5px solid rgba(255,0,0,0.18);
    }
    .glass-panel { position: relative; overflow: hidden; }
    .glass-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        rgba(255,255,255,0.045) 0px,
        rgba(255,255,255,0.045) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 4;
    }
    .screen-glare {
      position: absolute;
      top: -25%;
      left: -85%;
      width: 55%;
      height: 150%;
      background: linear-gradient(115deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.05) 45%, transparent 72%);
      transform: rotate(-11deg);
      pointer-events: none;
      z-index: 3;
    }
    .glass-shine {
      position: absolute;
      top: 0;
      left: -30%;
      width: 52%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.04) 30%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0.04) 70%, transparent 100%);
      transform: skewX(-18deg);
      -webkit-transform: skewX(-18deg);
      animation: shineSweep 5s ease-in-out infinite;
      opacity: 0.9;
      filter: blur(2px);
      -webkit-filter: blur(2px);
      mix-blend-mode: overlay;
      transition: opacity 0.2s;
    }
    @keyframes shineSweep {
      0% { left: -60%; }
      28% { left: 130%; }
      100% { left: 130%; }
    }
    .neon-text {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 6.5vw, 2.15rem);
      color: #fff;
      letter-spacing: 1.5px;
      margin-bottom: 0.17rem;
      word-break: break-word;
      line-height: 1.15;
      text-shadow:
        0 0 7px var(--main-red),
        0 0 14px var(--accent-red),
        0 0 8px var(--main-red);
      transition: color 0.2s;
      z-index: 3;
      position: relative;
    }
    .subtitle {
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: clamp(0.65rem, 1vw, 0.78rem);
      color: var(--accent-red);
      opacity: 0.92;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.04rem;
      font-weight: 400;
      z-index: 3;
      position: relative;
    }
    .year-animate {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.13rem;
      margin-bottom: 0.09rem;
      min-height: 2.0rem;
      z-index: 3;
      position: relative;
    }
    .year-digit {
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(0.95rem, 3.4vw, 1.08rem);
      color: #fff;
      animation: funny-bounce 4s infinite alternate cubic-bezier(.44,1.36,.89,.62);
      text-shadow: none;
      margin: 0 1px;
      letter-spacing: 1px;
    }
    .year-digit:nth-child(2) { animation-delay: 0.15s;}
    .year-digit:nth-child(3) { animation-delay: 0.3s;}
    .year-digit:nth-child(4) { animation-delay: 0.45s;}
    @keyframes funny-bounce {
      0% { transform: translateY(0) rotate(-5deg) scale(1);}
      30% { transform: translateY(-5px) rotate(5deg) scale(1.08);}
      60% { transform: translateY(0) rotate(-3deg) scale(1);}
      100% { transform: translateY(-7px) rotate(8deg) scale(1.1);}
    }
    .screen-headline-bar {
      width: 100%;
      background: transparent;
      color: #fff;
      z-index: 10;
      overflow: hidden;
      min-height: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 400;
      font-size: 0.97rem;
      padding: 0;
      margin-top: 9px;
      position: relative;
      border-radius: 15px;
      letter-spacing: 0.02em;
      justify-content: center;
    }
    .screen-scroll-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen-scroll-text {
      display: flex;
      align-items: center;
      font-size: clamp(0.82rem, 2.8vw, 0.95rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 24px;
      height: 24px;
      color: #fff;
      text-shadow: 0 0 6px #000, 0 0 1px var(--accent-red);
      font-family: 'Montserrat', Arial, sans-serif;
      position: relative;
      z-index: 3;
    }
    .scrolling-text-inner {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: clamp(10px, 3.2vw, 18px) clamp(10px, 3.2vw, 18px);
      width: 92%;
      margin: 0 auto 0.17rem auto;
      z-index: 2;
      padding: 0 7px;
    }
    .contact-btn, .offer-btn {
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
      width: 100%;
      padding: clamp(0.72rem, 2.6vw, 0.98rem) 0.14rem;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.28);
      background: linear-gradient(160deg, rgba(255,110,110,0.95) 0%, rgba(255,0,0,0.92) 45%, rgba(150,0,0,0.95) 100%);
      color: var(--calculator-btn-text);
      font-weight: 400;
      font-size: 0.93rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.31rem;
      cursor: pointer;
      transition: background 0.17s, color 0.17s, box-shadow 0.18s, transform 0.15s;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      min-height: clamp(44px, 11.5vw, 48px);
      max-height: 60px;
      outline: none;
      text-align: center;
      box-sizing: border-box;
      box-shadow:
        var(--btn-shadow),
        0 5px 10px rgba(0,0,0,0.35),
        inset 0 2px 2px rgba(255,255,255,0.65),
        inset 0 -4px 6px rgba(80,0,0,0.55),
        inset 0 0 0 1px rgba(255,255,255,0.18);
      margin: 0;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Montserrat', Arial, sans-serif;
    }
    .contact-btn::after, .offer-btn::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 5%;
      width: 90%;
      height: 46%;
      border-radius: 50px 50px 60% 60% / 40px 40px 100% 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.22) 55%, rgba(255,255,255,0) 100%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
      filter: blur(0.2px);
    }
    .contact-btn:active, .offer-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow:
        0 2px 5px rgba(0,0,0,0.35),
        inset 0 3px 6px rgba(0,0,0,0.4),
        inset 0 -1px 1px rgba(255,255,255,0.3);
    }
    .contact-btn:focus, .offer-btn:focus {
      outline: var(--focus-outline);
      box-shadow: var(--focus-shadow);
    }
    .contact-btn::before, .offer-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.11) 50%, transparent 100%);
      transition: left 0.5s;
      z-index: 1;
      pointer-events: none;
    }
    .contact-btn:hover::before, .offer-btn:hover::before { left: 100%; }
    .contact-btn:hover, .contact-btn:focus-visible,
    .offer-btn:hover, .offer-btn:focus-visible {
      background: linear-gradient(160deg, #ffffff 0%, #ffe9e9 45%, #ffd0d0 100%);
      color: var(--calculator-btn-hover-text);
      box-shadow:
        0 3px 14px 0px var(--accent-red), var(--btn-shadow),
        inset 0 2px 3px rgba(255,255,255,0.9),
        inset 0 -3px 5px rgba(200,0,0,0.25),
        inset 0 0 0 1px rgba(255,255,255,0.6);
      z-index: 2;
    }
    .contact-btn:hover i, .contact-btn:focus-visible i,
    .contact-btn:hover span, .contact-btn:focus-visible span,
    .offer-btn:hover i, .offer-btn:focus-visible i,
    .offer-btn:hover span, .offer-btn:focus-visible span {
      color: #e0002b !important;
    }
    .contact-btn i, .offer-btn i {
      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      color: #fff;
      min-width: 1.1rem;
      z-index: 2;
      position: relative;
      text-shadow: 0 1px 1px rgba(0,0,0,0.35);
    }
    .contact-btn span, .offer-btn span {
      font-size: clamp(0.7rem, 2.4vw, 0.8rem);
      line-height: .5;
      z-index: 2;
      color: inherit;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0.01em;
      margin-left: 1px;
      position: relative;
      text-shadow: 0 1px 1px rgba(0,0,0,0.25);
    }
    .offer-btn {
      min-width: 0;
      width: 100%;
      margin: 0;
      padding: 0.98rem 0.14rem 0.98rem 0.14rem;
    }
    .floating-elements {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 3;
    }
    .floating-icon {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.13;
      color: var(--main-red);
      animation: floatIcon 5s infinite ease-in-out;
      pointer-events: none;
    }
    .floating-icon.fa-code { top: 12%; left: 10%; animation-delay: 0s;}
    .floating-icon.fa-palette { top: 30%; right: 7%; animation-delay: 10s;}
    .floating-icon.fa-rocket { top: 65%; left: 8%; animation-delay: 20s;}
    .floating-icon.fa-star { top: 82%; right: 23%; animation-delay: 30s;}
    .floating-icon.fa-heart { top: 47%; right: 5%; animation-delay: 40s;}
    .floating-icon.fa-lightbulb { top: 15%; right: 30%; animation-delay: 3.2s;}
    .floating-icon.fa-magic { top: 75%; left: 25%; animation-delay: 5.3s;}
    .floating-icon.fa-music { top: 50%; left: 40%; animation-delay: 2.6s;}
    .floating-icon.fa-gamepad { top: 80%; left: 70%; animation-delay: 3.2s;}
    .floating-icon.fa-glasses { top: 20%; right: 45%; animation-delay: 4.1s;}
    .floating-icon.fa-calculator { top: 35%; left: 60%; animation-delay: 1.3s;}
    .floating-icon.fa-equals { top: 60%; right: 18%; animation-delay: 2.9s;}
    .floating-icon.fa-divide { top: 25%; left: 20%; animation-delay: 3.8s;}
    .floating-icon.fa-square-root-alt { top: 70%; right: 5%; animation-delay: 1.7s;}
    .floating-icon.fa-plus { top: 25%; right: 15%; animation-delay: 2.5s;}
    .floating-icon.fa-minus { top: 80%; left: 15%; animation-delay: 2.2s;}
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.13; }
      50% { transform: translateY(-18px) rotate(180deg); opacity: 0.05; }
    }

    /* ---------- Services floating background ---------- */
    .services-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 3;
    }
    .service-chip {
      position: absolute;
      bottom: -60px;
      white-space: nowrap;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 500;
      font-size: clamp(0.6rem, 2vw, 0.7rem);
      letter-spacing: 0.03em;
      color: #ffc9c9;
      background: rgba(255, 0, 0, 0.07);
      border: 1px solid rgba(255, 51, 51, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      text-shadow: 0 0 5px rgba(255, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      animation-name: chipFloat;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      will-change: transform, opacity;
    }
    .service-chip.long {
      white-space: normal;
      max-width: 190px;
      text-align: center;
      font-size: clamp(0.56rem, 1.9vw, 0.63rem);
      line-height: 1.35;
      padding: 8px 12px;
    }
    @keyframes chipFloat {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      8%   { opacity: 0.8; }
      88%  { opacity: 0.8; }
      100% { transform: translateY(-130vh) translateX(var(--drift, 0px)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .service-chip { animation: none; opacity: 0; }
    }
    /* ---------------------------------------------------- */

    .share-fab {
      -webkit-appearance: none;
      appearance: none;
      position: fixed;
      bottom: 32px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: linear-gradient(45deg, var(--main-red), var(--accent-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(255,0,0,0.23);
      transition: all 0.15s ease;
      border: none;
      font-size: 0.85rem;
      outline: none;
    }
    .share-fab:focus { outline: var(--focus-outline); box-shadow: var(--focus-shadow); }
    .share-fab:hover, .share-fab:focus-visible {
      transform: scale(1.07) rotate(360deg);
      box-shadow: 0 4px 12px rgba(255,0,0,0.28);
    }
    .quantum-cursor {
      pointer-events: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,0,0,0.09) 0%, rgba(255,0,0,0.03) 40%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: all 0.1s ease;
      mix-blend-mode: screen;
      animation: quantumPulse 2s infinite;
    }
    @keyframes quantumPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.11); }
    }
    .toast {
      position: fixed;
      bottom: 60px;
      right: 8px;
      background: linear-gradient(45deg, var(--main-red), var(--accent-red));
      color: white;
      padding: 0.34rem 0.7rem;
      border-radius: 15px;
      font-weight: 600;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.5s ease;
      box-shadow: 0 2px 8px rgba(255,0,0,0.13);
      font-size: 0.67rem;
    }
    .card-flip-container {
      perspective: 1200px;
      -webkit-perspective: 1200px;
      width: var(--card-w);
      aspect-ratio: var(--card-ratio);
      height: auto;
      position: relative;
    }
    .card-flip {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.8s ease-in-out;
      position: relative;
    }
    .card-flip.flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 15px;
      overflow: hidden;
    }
    .card-face.back {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
      background: linear-gradient(135deg, #000000, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 16px 16px 14px 16px;
      flex-direction: column;
      gap: 12px;
    }
    .signature-screen {
      position: relative;
      width: 88%;
      max-width: 280px;
      margin-top: 0;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(25,0,0,0.42) 0%, rgba(25,0,0,0.45) 50%, rgba(25,0,0,0.42) 100%);
      border: 1.5px solid rgba(255,0,0,0.18);
      box-shadow:
        0 4px 28px 0 rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.2),
        inset 0 -10px 18px -12px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,0,0,0.08);
      backdrop-filter: blur(5px) saturate(210%);
      -webkit-backdrop-filter: blur(5px) saturate(210%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
    }
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 10px 10px;
      width: 92%;
      margin-top: 0;
      z-index: 2;
    }
    .social-grid .contact-btn:last-child:nth-child(odd) {
      grid-column: 1 / span 2;
      max-width: 48%;
      margin: 0 auto;
    }
    .typing-box {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.68rem, 2.4vw, 0.82rem);
      color: #fff;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #ff3333;
      width: auto;
      max-width: 100%;
      position: relative;
      z-index: 6;
      animation: glowPulse 3.6s ease-in-out infinite, blink 1.75s step-end infinite;
    }
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 5px #ff0000, 0 0 8px #ff3333; }
      50% { text-shadow: 0 0 10px #ff2222, 0 0 18px #ff4444, 0 0 26px #ff0000; }
    }
    .blink-eye {
      display: inline-block;
      transform-origin: center;
      animation: eyeBlink 4s ease-in-out infinite;
    }
    @keyframes eyeBlink {
      0%, 88%, 100% { transform: scaleY(1); }
      92% { transform: scaleY(0.12); }
      96% { transform: scaleY(1); }
    }
    @keyframes blink { 50% { border-color: transparent; } }
    #audio-toggle {
      -webkit-appearance: none;
      appearance: none;
      position: fixed;
      bottom: 60px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: linear-gradient(45deg, var(--main-red), var(--accent-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(255,0,0,0.23);
      transition: all 0.15s ease;
      border: none;
      font-size: 0.85rem;
      outline: none;
    }
    #audio-toggle:focus { outline: var(--focus-outline); box-shadow: var(--focus-shadow); }
    #audio-toggle:hover, #audio-toggle:focus-visible {
      transform: scale(1.07) rotate(360deg);
      box-shadow: 0 4px 12px rgba(255,0,0,0.28);
    }
    .firefly-mini-container {
      position: relative;
      width: 80vmin;
      height: 80vmin;
      font-family: 'Playfair Display', serif;
    }
    .firefly-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .jar {
      position: absolute;
      width: 60vmin;
      height: 60vmin;
      background: var(--lightgrey);
      border-bottom-left-radius: 10vmin;
      border-bottom-right-radius: 10vmin;
      top: 30vmin;
      left: 10vmin;
    }
    .jartop {
      position: absolute;
      width: 48vmin;
      height: 20vmin;
      background: var(--lightgrey);
      top: -21vmin;
      left: 6vmin;
      z-index: 1;
    }
    .jarlid {
      position: absolute;
      width: 55vmin;
      height: 6vmin;
      background: var(--lightestgrey);
      border-radius: 10vmin;
      top: -28vmin;
      left: 2.3vmin;
      transform-origin: 100% 100%;
    }
    .wording {
      position: absolute;
      left: 2vmin;
      font-size: 10vmin;
      color: #ff0000;
      user-select: none;
    }
    .help { transform: rotate(-20deg); opacity: 1; transition: opacity 2s; transition-delay: 1s; }
    .thanks { transform: rotate(0deg); opacity: 0; left: 0vmin; top: 10vmin; }
    .firefly { position: absolute; width: 0vmin; height: 0vmin; left: 10vmin; top: +10vmin; z-index: 1; }
    .body { position: absolute; width: 12vmin; height: 10vmin; background: var(--red); left: 14vmin; top: 15vmin; z-index: 1; }
    .bodybottom { position: absolute; width: 12vmin; height: 12vmin; background: var(--yellow); top: 9vmin; border-radius: 0 0 10vmin 10vmin; z-index: -1; }
    .wing { position: absolute; background: var(--nearlyblack); border-radius: 50%; width: 25vmin; height: 9.5vmin; top: 7vmin; transform-origin: 100% 50%; z-index: 3; }
    .wing-left { left: -5vmin; transform: rotate(-45deg); }
    .wing-right { left: 20vmin; transform: rotate(45deg); transform-origin: 0% 50%; }
    .head { position: absolute; width: 8vmin; height: 8vmin; border-radius: 50%; background: var(--nearlyblack); left: 16vmin; top: 4vmin; z-index: 2; }
    .head::before, .head::after {
      content: "";
      position: absolute;
      width: 6vmin;
      height: 6vmin;
      border: 0.6vmin solid;
      border-radius: 50%;
      border-color: var(--nearlyblack) transparent transparent transparent;
      top: -2vmin;
    }
    .head::before { left: 5vmin; transform: rotate(-30deg); }
    .head::after { left: -4vmin; transform: rotate(30deg); }
    .jar:hover .bodybottom,
    .card-flip.flipped .jar .bodybottom { box-shadow: inset 0vmin 18vmin 0vmin var(--lightyellow), 0px 0px 40vmin 20vmin var(--yellow); }
    .jar:hover .wing,
    .card-flip.flipped .jar .wing { background: var(--grey); }
    .jar:hover .wing-left,
    .card-flip.flipped .jar .wing-left { animation: flap-left 0.2s 1.2s 50 linear; }
    .jar:hover .wing-right,
    .card-flip.flipped .jar .wing-right { animation: flap-right 0.2s 1.2s 50 linear; }
    .jar:hover .head,
    .card-flip.flipped .jar .head { background: var(--grey); }
    .jar:hover .head::before, .jar:hover .head::after,
    .card-flip.flipped .jar .head::before, .card-flip.flipped .jar .head::after { border-color: var(--grey) transparent transparent transparent; }
    .jar:hover,
    .card-flip.flipped .jar { animation: shake 1s 3 linear; }
    .jar:hover .jarlid,
    .card-flip.flipped .jar .jarlid { animation: lid-rise 3.5s 1s linear; }
    .jar:hover .help,
    .card-flip.flipped .jar .help { opacity: 0; }
    .jar:hover .thanks,
    .card-flip.flipped .jar .thanks { animation: fade-in 3.5s 0.5s normal forwards; }
    @keyframes flap-left { 0% { transform: rotate(-75deg); } 50% { transform: rotate(-15deg); } }
    @keyframes flap-right { 0% { transform: rotate(75deg); } 50% { transform: rotate(15deg); } }
    @keyframes shake {
      0%, 100% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
    }
    @keyframes lid-rise { 0% { transform: rotate(0deg); } 20% { transform: rotate(90deg); } 100% { transform: rotate(90deg); } }
    @keyframes fly { 0% { transform: translateY(-5vmin); } 100% { transform: translateY(-250vmin); } }
    @keyframes fade-in { 0%, 66% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes ripple { to { transform: scale(3.2); opacity: 0; } }

    /* ---------- Free-roaming firefly (same firefly, just released from the jar) ---------- */
    .firefly.roaming {
      position: fixed !important;
      left: 0 !important;
      top: 0 !important;
      margin: 0;
      z-index: 500;
      pointer-events: none;
      transform-origin: center center;
      will-change: transform;
    }
    .firefly.roaming .bodybottom {
      animation: fireflyGlowPulse 1.3s ease-in-out infinite;
    }
    .firefly.roaming .wing {
      background: var(--grey);
    }
    .firefly.roaming .wing-left {
      animation: flap-left 0.16s ease-in-out infinite;
    }
    .firefly.roaming .wing-right {
      animation: flap-right 0.16s ease-in-out infinite;
    }
    .firefly.roaming .head {
      background: var(--grey);
    }
    .firefly.roaming .head::before,
    .firefly.roaming .head::after {
      border-color: var(--grey) transparent transparent transparent;
    }
    @keyframes fireflyGlowPulse {
      0%, 100% { box-shadow: inset 0vmin 10vmin 0vmin var(--lightyellow), 0px 0px 18vmin 8vmin var(--yellow); }
      50% { box-shadow: inset 0vmin 20vmin 0vmin var(--lightyellow), 0px 0px 42vmin 22vmin var(--yellow); }
    }
    /* ------------------------------------------------------------------------------------- */

    /* =====================================================================
       GATE + 5-SECOND INTRO SEQUENCE
       Timeline: black door opens -> logo settles -> logo eyes blink ->
       glass-blur transition -> digital card sharpens into view.
       ===================================================================== */
    html.intro-lock, html.intro-lock body { overflow: hidden; height: 100%; }

    #introRoot {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5000;
      pointer-events: auto;
    }
    #introRoot.intro-done { display: none; }

    /* ---- pure black stage behind the gate ---- */
    .intro-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 46%, rgba(120,0,0,0.28) 0%, transparent 55%),
        #050303;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: clamp(10px, 2.4vh, 18px);
      z-index: 1;
    }

    /* ---- gate doors ---- */
    .gate-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50.4%;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 12%),
        linear-gradient(135deg, #0a0a0a 0%, #171010 45%, #0a0a0a 100%);
      box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
      transition: transform 1s cubic-bezier(.77,0,.18,1);
      z-index: 3;
    }
    .gate-left { left: 0; transform: translateX(0); border-right: 1px solid rgba(255,0,0,0.18); }
    .gate-right { right: 0; transform: translateX(0); border-left: 1px solid rgba(255,0,0,0.18); }
    .gate-panel::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(255,40,40,0.55), transparent);
      filter: blur(0.5px);
    }
    .gate-left::after { right: -1px; }
    .gate-right::after { left: -1px; }
    #introRoot.stage-open .gate-left  { transform: translateX(-101%); }
    #introRoot.stage-open .gate-right { transform: translateX(101%); }

    /* ---- logo: fade + scale in, then only the RIGHT loop ("eye") blinks ---- */
    .intro-logo-wrap {
      position: relative;
      width: clamp(96px, 24vw, 148px);
      aspect-ratio: 485 / 386;
      opacity: 0;
      transform: scale(0.72);
      filter: drop-shadow(0 0 0 rgba(255,180,60,0));
      transition: opacity 0.7s cubic-bezier(.2,.7,.2,1), transform 0.8s cubic-bezier(.2,.7,.2,1), filter 1s ease;
    }
    .intro-logo-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
    #introRoot.stage-logo .intro-logo-wrap {
      opacity: 1;
      transform: scale(1);
      filter: drop-shadow(0 0 20px rgba(255,170,40,0.5));
    }
    /* right loop only — precisely matched to the mark's own right circle */
    .intro-eye-right {
      position: absolute;
      left: 49.5%;
      top: 13.5%;
      width: 50%;
      height: 63.5%;
      background: #050303;
      border-radius: 48% 52% 55% 45% / 50% 50% 50% 50%;
      transform: scaleY(0);
      transform-origin: center;
    }
    #introRoot.stage-blink .intro-eye-right {
      animation: eyelidBlink 0.5s ease-in-out 2;
    }
    @keyframes eyelidBlink {
      0%   { transform: scaleY(0); }
      35%  { transform: scaleY(1); }
      65%  { transform: scaleY(1); }
      100% { transform: scaleY(0); }
    }


    /* ---- glass-effect transition: layered glossy sheen + refraction blur ---- */
    .glass-sweep {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background:
        linear-gradient(102deg, transparent 26%, rgba(255,255,255,0.10) 40%, rgba(255,255,255,0.65) 49%, rgba(255,255,255,0.10) 58%, transparent 74%);
      backdrop-filter: blur(0px) saturate(100%);
      -webkit-backdrop-filter: blur(0px) saturate(100%);
      transform: translateX(-45%);
    }
    .glass-sweep::before {
      content: '';
      position: absolute;
      inset: -10%;
      background: linear-gradient(96deg, transparent 30%, rgba(120,210,255,0.16) 46%, transparent 54%);
      mix-blend-mode: screen;
      transform: translateX(-6%);
      pointer-events: none;
    }
    .glass-sweep::after {
      content: '';
      position: absolute;
      inset: -10%;
      background: linear-gradient(108deg, transparent 44%, rgba(255,190,110,0.18) 52%, transparent 66%);
      mix-blend-mode: screen;
      transform: translateX(6%);
      pointer-events: none;
    }
    #introRoot.stage-glass .glass-sweep {
      opacity: 1;
      animation: glassSweepMove 1.05s cubic-bezier(.3,.6,.2,1) forwards;
    }
    @keyframes glassSweepMove {
      0%   { transform: translateX(-50%); backdrop-filter: blur(0px) saturate(100%); -webkit-backdrop-filter: blur(0px) saturate(100%); opacity: 0; }
      12%  { opacity: 1; }
      45%  { backdrop-filter: blur(11px) saturate(165%); -webkit-backdrop-filter: blur(11px) saturate(165%); }
      88%  { opacity: 0.9; }
      100% { transform: translateX(50%); backdrop-filter: blur(0px) saturate(100%); -webkit-backdrop-filter: blur(0px) saturate(100%); opacity: 0; }
    }
    /* soft flash of light the instant the card locks into full focus */
    .glass-flash {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 48%, rgba(255,255,255,0.85) 0%, rgba(255,210,150,0.25) 30%, transparent 62%);
    }
    #introRoot.stage-glass .glass-flash {
      animation: glassFlashPulse 1.05s ease-out forwards;
    }
    @keyframes glassFlashPulse {
      0%, 40% { opacity: 0; }
      54%     { opacity: 0.9; }
      100%    { opacity: 0; }
    }


    #introRoot.stage-glass .intro-stage,
    #introRoot.stage-glass .gate-panel {
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    #introRoot.stage-fadeout { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }

    /* the card sits blurred/soft behind the gate, then sharpens into focus
       with a glossy, slightly-overshooting settle exactly as the glass
       sweep passes over it */
    body.intro-active .card-flip-container {
      filter: blur(22px) saturate(100%);
      opacity: 0.3;
      transform: scale(0.92);
      transition: filter 0.95s cubic-bezier(.2,.7,.2,1), opacity 0.8s ease, transform 1s cubic-bezier(.34,1.56,.64,1);
    }
    body.intro-active.intro-glass .card-flip-container {
      filter: blur(0) saturate(112%);
      opacity: 1;
      transform: scale(1);
    }

    .intro-skip {
      position: absolute;
      bottom: 18px;
      right: 16px;
      z-index: 10;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.8);
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 0.62rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 30px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease, background 0.2s ease;
      z-index: 6;
    }
    #introRoot.stage-open .intro-skip { opacity: 1; }
    .intro-skip:hover, .intro-skip:focus-visible { background: rgba(255,255,255,0.16); outline: none; }

    .replay-intro-btn {
      -webkit-appearance: none;
      appearance: none;
      position: fixed;
      bottom: 8px;
      left: 8px;
      z-index: 100;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.75);
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 0.56rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .replay-intro-btn i { font-size: 0.6rem; }
    .replay-intro-btn:hover, .replay-intro-btn:focus-visible { background: rgba(255,0,0,0.35); color: #fff; outline: none; }

    @media (prefers-reduced-motion: reduce) {
      .gate-panel, .intro-frame, .intro-logo-wrap, .intro-line, #introRoot { transition: none !important; animation: none !important; }
    }

    /* =====================================================================
       CARD WORDMARK ANIMATION — "ArtViSiøN" gets a soft breathing neon
       glow plus a periodic gold/white shimmer sweep across the letters.
       (No separate logo icon on the card — the wordmark carries the brand.)
       ===================================================================== */
    .neon-text {
      animation: neonGlowPulse 3.2s ease-in-out infinite;
    }
    @keyframes neonGlowPulse {
      0%, 100% {
        text-shadow:
          0 0 7px var(--main-red),
          0 0 14px var(--accent-red),
          0 0 8px var(--main-red);
      }
      50% {
        text-shadow:
          0 0 11px var(--main-red),
          0 0 20px var(--accent-red),
          0 0 15px var(--main-red),
          0 0 28px rgba(255,120,0,0.4);
      }
    }
    .neon-text::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg,
        transparent 22%,
        rgba(255,255,255,0.95) 42%,
        rgba(255,205,110,0.95) 50%,
        rgba(255,255,255,0.95) 58%,
        transparent 78%);
      background-size: 260% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
      mix-blend-mode: overlay;
      animation: neonShimmerSweep 3.8s ease-in-out infinite;
      animation-delay: 0.6s;
    }
    @keyframes neonShimmerSweep {
      0%   { background-position: 160% 0; opacity: 0; }
      10%  { opacity: 1; }
      48%  { background-position: -60% 0; opacity: 1; }
      60%  { opacity: 0; }
      100% { background-position: -60% 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .neon-text, .neon-text::before { animation: none !important; }
    }

    /* ---- the gear emoji in the wordmark rotates forever, like a real cog ---- */
    .gear-spin {
      display: inline-block;
      transform-origin: 50% 50%;
      animation: gearTurn 4s linear infinite;
      will-change: transform;
    }
    @keyframes gearTurn {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    /* visually hidden, keeps the wordmark readable for screen readers */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .gear-spin { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="introRoot" aria-hidden="true">

    function matrixRain() {
      let frameCount = 0;
      const canvas = document.getElementById("matrix-canvas");
      const ctx = canvas.getContext("2d");
      function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      const chars = "रंजन सरकार DESIGN विज़ुअल ART ABC abc 123";
      const fontSize = 18;
      let columns = Math.floor(window.innerWidth / fontSize);
      let drops = Array(columns).fill(1);
      let stars = [];
      function createStar() {
        if (Math.random() > 0.985) {
          stars.push({ x: Math.random() * canvas.width, y: canvas.height + 10, size: Math.random() * 2 + 1, speed: Math.random() * 1.5 + 0.5, opacity: Math.random() * 0.8 + 0.2, twinkle: Math.random() * Math.PI * 2 });
        }
      }
      function drawStars() {
        for (let i = stars.length - 1; i >= 0; i--) {
          const s = stars[i];
          s.y -= s.speed * 0.6;
          s.twinkle += 0.05;
          if (s.y < -20) stars.splice(i, 1);
          const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 3);
          glow.addColorStop(0, "#fff");
          glow.addColorStop(0.3, "#fcc");
          glow.addColorStop(1, "rgba(255,0,0,0)");
          ctx.globalAlpha = s.opacity * (Math.sin(s.twinkle * 2) * 0.4 + 0.6);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      function draw() {
        frameCount++;
        if (frameCount % 3 !== 0) { requestAnimationFrame(draw); return; }
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          ctx.fillStyle = Math.random() > 0.975 ? "#fb0" : "#ff4444";
          ctx.shadowColor = "#ff0000";
          ctx.shadowBlur = 3;
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.965) drops[i] = 0;
          drops[i] += 0.35;
        }
        createStar();
        drawStars();
        requestAnimationFrame(draw);
      }
      draw();
    }

      const FIXED_SCALE = 0.13;
      const homeParent = fireflyEl.parentElement;
      const homeNextSibling = fireflyEl.nextSibling;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let hasPointer = false;
      document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; hasPointer = true; });
      document.addEventListener('pointermove', (e) => { mouseX = e.clientX; mouseY = e.clientY; hasPointer = true; }, { passive: true });

        if (e.touches && e.touches[0]) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; hasPointer = true; }
      }, { passive: true });

      // The .firefly anchor is a 0x0 box, so "translate(-50%,-50%)" cannot centre it and
      // the glowing body actually renders well below/right of that anchor. Measure the real
      // offset once so the GLOW (not the invisible anchor) is what tracks the cursor.
      let glowOffX = 0, glowOffY = 0;
      function paint(x, y, rotateDeg) {
        const r = rotateDeg ? ` rotate(${rotateDeg}deg)` : '';
        fireflyEl.style.transform =
          `translate(${x - glowOffX}px, ${y - glowOffY}px) translate(-50%, -50%)${r} scale(${FIXED_SCALE})`;
      }
      // Calibrate against the REAL rendered geometry: paint once with no correction,
      // see where the glow actually landed, and keep that delta. Measuring the children
      // directly would read their unscaled vmin sizes and be ~10x too large.
      function measureGlowOffset(atX, atY) {
        const glow = fireflyEl.querySelector('.bodybottom') || fireflyEl.querySelector('.body');
        if (!glow) return;
        glowOffX = 0; glowOffY = 0;
        paint(atX, atY, 0);                       // same frame - never painted to screen
        const gr = glow.getBoundingClientRect();
        glowOffX = (gr.left + gr.width / 2) - atX;
        glowOffY = (gr.top + gr.height / 2) - atY;
      }

      let state = 'jar'; // 'jar' | 'free' | 'fleeing'
      let releaseTimer = null;
      let rafId = null;
      let curX = 0, curY = 0;
      let angle = Math.random() * Math.PI * 2;

      function releaseFirefly() {
        if (state !== 'jar') return;
        // start from where the glow currently sits inside the jar, so there is no jump
        const glow = fireflyEl.querySelector('.bodybottom') || fireflyEl.querySelector('.body');
        const gr = (glow || fireflyEl).getBoundingClientRect();
        curX = gr.left + gr.width / 2;
        curY = gr.top + gr.height / 2;
        document.body.appendChild(fireflyEl);
        fireflyEl.classList.add('roaming');
        fireflyEl.style.transition = 'none';
        measureGlowOffset(curX, curY);
        paint(curX, curY, 0);
        state = 'free';
        rafId = requestAnimationFrame(loop);
      }

      function loop(now) {
        if (state !== 'free') return;
        angle += 0.05;

        // hover in a small, lively circle right around the cursor
        const orbitRadius = 26 + Math.sin(now / 700) * 10;
        const baseX = hasPointer ? mouseX : window.innerWidth / 2;
        const baseY = hasPointer ? mouseY : window.innerHeight / 2;
        const targetX = baseX + Math.cos(angle) * orbitRadius;
        const targetY = baseY + Math.sin(angle * 1.3) * orbitRadius * 0.6;

        // chase hard enough to keep up with fast cursor movement
        const dx = targetX - curX;
        const dy = targetY - curY;
        const dist = Math.hypot(dx, dy);
        const ease = dist > 220 ? 0.22 : dist > 90 ? 0.15 : 0.10;
        curX += dx * ease;
        curY += dy * ease;

        // bank into the direction of travel, like a real insect
        const tilt = Math.max(-22, Math.min(22, dx * 0.6)) + Math.sin(now / 500) * 5;
        paint(curX, curY, tilt);
        rafId = requestAnimationFrame(loop);
      }

      // vmin-based sizing means the glow offset changes with the viewport
      window.addEventListener('resize', () => { if (state === 'free') measureGlowOffset(curX, curY); });

      function fleeFirefly() {
        if (state !== 'free') return;
        state = 'fleeing';
        if (rafId) cancelAnimationFrame(rafId);
        const dx = curX - window.innerWidth / 2;
        const dy = curY - window.innerHeight / 2;
        let targetX, targetY;
        if (Math.abs(dx) > Math.abs(dy)) {
          targetX = dx > 0 ? window.innerWidth + 200 : -200;
          targetY = curY - 250 - Math.random() * 150;
        } else {
          targetX = curX + (Math.random() - 0.5) * 200;
          targetY = dy > 0 ? window.innerHeight + 200 : -200;
        }
        fireflyEl.style.transition = 'transform 0.8s cubic-bezier(.4,0,.6,1)';
        paint(targetX, targetY, 0);
        setTimeout(() => {
          fireflyEl.classList.remove('roaming');
          fireflyEl.removeAttribute('style');
          if (homeNextSibling) { homeParent.insertBefore(fireflyEl, homeNextSibling); }
          else { homeParent.appendChild(fireflyEl); }
          state = 'jar';
        }, 820);
      }

      function toggleFlip() {
        cardFlip.classList.toggle('flipped');
        const isFlipped = cardFlip.classList.contains('flipped');
        if (isFlipped) {
          if (releaseTimer) clearTimeout(releaseTimer);
          releaseTimer = setTimeout(releaseFirefly, 2800);
        } else {
          if (releaseTimer) { clearTimeout(releaseTimer); releaseTimer = null; }
          if (state === 'free') fleeFirefly();
        }
      }
      cardFlip.addEventListener('click', toggleFlip);
      cardFlip.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          toggleFlip();
        }
      });
    })();
